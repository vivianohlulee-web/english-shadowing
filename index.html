// word-by-word html with estimated timing per word
function wordsHtml(text,chunkIdx){
  const words=text.split(' ');
  const dur=chunkDur(chunkIdx);
  const perWord=dur/words.length;
  return words.map((w,wi)=>`<span class="w" data-ci="${chunkIdx}" data-wi="${wi}" data-t="${(chunks[chunkIdx].t+wi*perWord).toFixed(2)}">${w}</span>`).join(' ');
}

  "You're weak. You're weird. Your pants are undone. Oh.":['weak','weird','undone']
};

function pickBlanks(text){
  const ws=text.split(' ');
  // try prebuilt map first
  const key=Object.keys(_blankMap).find(k=>text.includes(k.slice(0,20)));
  if(key){
    const targets=_blankMap[key];
    const idxs=[];
    targets.forEach(t=>{
      const ti=ws.findIndex(w=>w.replace(/[^a-zA-Z']/g,'').toLowerCase()===t.toLowerCase());
      if(ti>=0&&!idxs.includes(ti))idxs.push(ti);
    });
    if(idxs.length)return idxs.slice(0,2).sort((a,b)=>a-b);
  }
  // fallback: score-based
  const scored=ws.map((raw,i)=>{
    const w=raw.replace(/[^a-zA-Z']/g,'').toLowerCase();
    if(w.length<3)return{i,score:-1};
    let s=0;
    if(!_fw.has(w))s+=3;
    if(w.length>=6)s+=2;else if(w.length>=4)s+=1;
    if(/ing$|tion$|ness$|ment$|ful$|less$|ize$|ise$/.test(w))s+=2;
    if(/ed$/.test(w)&&w.length>4)s+=1;
    if(i===0)s-=1;
    return{i,score:s};
  }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
  if(!scored.length){const f=ws.findIndex(w=>w.replace(/[^a-zA-Z]/g,'').length>=4);return[f<0?0:f];}
  if(scored.length===1)return[scored[0].i];
  const first=scored[0];
  const second=scored.find(x=>x.i!==first.i&&Math.abs(x.i-first.i)>1)||scored[1];
  return[first.i,second.i].sort((a,b)=>a-b);
}


const $=id=>document.getElementById(id), video=$('video'), KEY='friends-shadow-v2';
let state={cur:0,notes:{},favorites:{},mastery:{},drafts:{},settings:{}};
try{const old=JSON.parse(localStorage.getItem(KEY));if(old&&typeof old==='object')for(const k of Object.keys(state))if(old[k]!=null)state[k]=old[k];}catch(e){}
let cur=Number.isInteger(state.cur)&&chunks[state.cur]?state.cur:0;
function save(){state.cur=cur;try{localStorage.setItem(KEY,JSON.stringify(state));$('saved').textContent='已保存到当前浏览器';return true;}catch(e){$('saved').textContent='保存失败，请复制笔记备份';return false;}}
const expressions={22:['checking in on me','关心、问候我的近况','朋友在你低落时来问候你。','Thanks for checking in on me.','朋友知道你工作很累，发消息问候。试着感谢对方。'],7:['get back together','复合，重新在一起','谈论分手后的关系。','Do you want to get back together?','问朋友是否想与前任复合。'],30:['thrown off','被打乱思路，感到措手不及','意外的问题或消息让你一时不知如何回应。','I was thrown off by the question.','描述一个突然的问题让你乱了思路。'],32:['hang out as friends','以朋友的身份一起相处','邀请别人轻松聚聚。',"Let's hang out this weekend.",'邀请朋友这个周末一起聚聚。'],39:['memorize','熟记，记住','有意识地记下某个细节。','I tried to memorize the route.','说说你试着记住一条路线。']};
let run=null, generation=0, waitTimer=0, raf=0, internalPause=false, rec=null, pendingRec=0, recUrl=null, audio=null, currentBlob=null;
function status(s){$('status').textContent=s;}
function pauseVideo(){internalPause=true;video.pause();queueMicrotask(()=>internalPause=false);}
function stop(message='已暂停'){generation++;run=null;clearTimeout(waitTimer);cancelAnimationFrame(raf);pauseVideo();$('play').textContent='▶ 开始跟读';status(message);}
function stopAudio(){if(audio){audio.pause();audio=null;}}
function endRecording(){pendingRec++;if(rec&&rec.state==='recording')rec.stop();}
function choose(i){if(!chunks[i])return;stop('准备开始');endRecording();stopAudio();cur=i;save();render();}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function renderLists(){
 $('sentences').innerHTML=chunks.map((c,i)=>`<button data-index="${i}" class="${i===cur?'active':''}">${i+1}. ${escapeHTML(c.text)}<small>${fmtT(c.t)}</small></button>`).join('');
 const ids=Object.keys(state.favorites).filter(i=>state.favorites[i]&&chunks[i]).map(Number).sort((a,b)=>(state.mastery[a]==='hard'?0:1)-(state.mastery[b]==='hard'?0:1));
 $('favCount').textContent=ids.length;
 $('reviews').innerHTML=ids.length?ids.map(i=>`<button data-index="${i}">${i+1}. ${escapeHTML(expressions[i]?.[0]||chunks[i].text)}<small>${({hard:'还不熟',follow:'能跟上',own:'能独立说'})[state.mastery[i]]||'未标记'} · 点击重练</small></button>`).join(''):'还没有收藏。点击「收藏本句」留下想重练的内容。';
}
function render(){
 const c=chunks[cur];$('counter').textContent=`第 ${cur+1} / ${chunks.length} 句 · ${fmtT(c.t)}`;
 $('english').textContent=c.text;$('chinese').textContent=c.cn;
 const sub=$('subtitle').value;$('english').hidden=!['bi','en'].includes(sub);$('chinese').hidden=!['bi','cn'].includes(sub);
 $('favorite').textContent=state.favorites[cur]?'★ 已收藏':'☆ 收藏本句';
 $('previous').disabled=cur===0;$('next').disabled=cur===chunks.length-1;
 $('note').value=state.notes[cur]||'';$('mastery').value=state.mastery[cur]||'new';
 const draft=state.drafts[cur]||{};$('dictation').value=draft.dictation||'';$('fillInput').value=draft.fillInput||'';
 $('dictResult').hidden=true;$('fillResult').hidden=true;$('dictResult').textContent=c.text;
 const blanks=pickBlanks(c.text);$('fillPrompt').textContent=c.text.split(' ').map((w,i)=>blanks.includes(i)?'______':w).join(' ');$('fillResult').textContent=blanks.map(i=>c.text.split(' ')[i]).join(', ');
 const e=expressions[cur];$('expression').innerHTML=e?`<details class="expression"><summary>重点表达 · 点击展开</summary><strong>${escapeHTML(e[0])}</strong><p>${escapeHTML(e[1])}</p><p>场景：${escapeHTML(e[2])}</p><p>可用句：${escapeHTML(e[3])}</p><p>自己说：${escapeHTML(e[4])}</p></details>`:'';
 if(sub==='off')$('expression').innerHTML='';
 renderLists();loadRecording(cur);
}
async function playRound(token){
 if(!run||token!==generation)return;
 video.currentTime=chunks[cur].t;
 try{await video.play();if(token!==generation)return;status(`原声 / 跟读 · 第 ${run.round} 轮`);tick(token);}catch(e){if(token===generation)stop('播放失败，请检查视频或点击播放器重试');}
}
function tick(token){
 if(token!==generation||!run)return;
 const c=chunks[cur];$('progress').value=Math.min(1,Math.max(0,(video.currentTime-c.t)/(c.end-c.t)));
 if(!video.seeking&&video.currentTime>=c.end){
  pauseVideo();run.phase='gap';
  const seconds=Number($('gap').value)+($('mode').value==='echo'?chunkDur(cur)/video.playbackRate:0);
  const until=Date.now()+seconds*1000;
  const advance=()=>{if(token!==generation||!run)return;const remaining=until-Date.now();if(remaining>0){status(`${$('mode').value==='echo'?'现在自己说':'休息'} · ${Math.ceil(remaining/1000)} 秒`);waitTimer=setTimeout(advance,100);return;}
   const max=Number($('repeat').value);if(max===0||run.round<max){run.round++;run.phase='play';playRound(token);}else if($('autoNext').checked&&cur<chunks.length-1){cur++;save();render();run.round=1;run.phase='play';playRound(token);}else stop('本句练习完成，试着不看英文再说一次');};advance();return;
 }
 raf=requestAnimationFrame(()=>tick(token));
}
function start(){stop();endRecording();stopAudio();run={round:1,phase:'play'};$('play').textContent='■ 停止练习';playRound(generation);}
video.addEventListener('pause',()=>{if(run&&run.phase==='play'&&!internalPause){if(video.currentTime>=chunks[cur].end)tick(generation);else stop();}});
video.addEventListener('seeking',()=>{if(run&&run.phase==='gap')stop('已停止循环，可重新开始');});
video.addEventListener('ended',()=>{if(run&&run.phase==='play')tick(generation);});
video.addEventListener('error',()=>{$('notice').textContent='视频未能加载。请确保本页与原来的 video.mp4 放在同一目录。';stop('视频未能加载');});
video.addEventListener('loadedmetadata',()=>{video.currentTime=chunks[cur].t;$('notice').textContent='';});
video.addEventListener('play',()=>{if(!run){endRecording();stopAudio();}});
// IndexedDB keeps audio local without filling localStorage.
const dbPromise=new Promise(resolve=>{try{const request=indexedDB.open(KEY,1);request.onupgradeneeded=()=>request.result.createObjectStore('recordings');request.onsuccess=()=>resolve(request.result);request.onerror=()=>resolve(null);}catch(e){resolve(null);}});
async function storeRecording(i,blob){const db=await dbPromise;if(!db)return false;return new Promise(resolve=>{try{const tx=db.transaction('recordings','readwrite');tx.objectStore('recordings').put(blob,i);tx.oncomplete=()=>resolve(true);tx.onerror=()=>resolve(false);tx.onabort=()=>resolve(false);}catch(e){resolve(false);}});}
async function loadRecording(i){currentBlob=null;$('replay').disabled=true;$('download').hidden=true;if(recUrl){URL.revokeObjectURL(recUrl);recUrl=null;}const db=await dbPromise;if(!db||i!==cur)return;const req=db.transaction('recordings').objectStore('recordings').get(i);req.onsuccess=()=>{if(i!==cur)return;currentBlob=req.result||null;showRecording();};}
function showRecording(){ $('replay').disabled=!currentBlob;if(!currentBlob)return;if(recUrl)URL.revokeObjectURL(recUrl);recUrl=URL.createObjectURL(currentBlob);$('download').href=recUrl;$('download').download=`friends-${cur+1}.${currentBlob.type.includes('mp4')?'m4a':'webm'}`;$('download').textContent='下载录音';$('download').hidden=false;}
async function record(){
 if(rec&&rec.state==='recording'){endRecording();return;}stop();stopAudio();
 if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){$('recordStatus').textContent='当前浏览器不支持录音，请使用 HTTPS 页面和新版浏览器。';return;}
 const token=++pendingRec,i=cur;$('record').disabled=true;$('recordStatus').textContent='等待麦克风权限…';
 try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});if(token!==pendingRec){stream.getTracks().forEach(t=>t.stop());return;}
 let mr;try{mr=new MediaRecorder(stream);}catch(e){stream.getTracks().forEach(t=>t.stop());throw e;}rec=mr;const parts=[];mr.ondataavailable=e=>{if(e.data.size)parts.push(e.data);};
 mr.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());if(rec===mr)rec=null;$('record').textContent='● 录音';$('record').classList.remove('recording');const blob=new Blob(parts,{type:mr.mimeType||parts[0]?.type||'audio/webm'});const saved=await storeRecording(i,blob);if(cur===i){currentBlob=blob;showRecording();$('recordStatus').textContent=saved?'录音已保存到本机浏览器':'无法持久保存，请下载本次录音';}};
 mr.onerror=()=>{stream.getTracks().forEach(t=>t.stop());$('recordStatus').textContent='录音被中断，请重试';};mr.start();$('record').textContent='■ 停止录音';$('record').classList.add('recording');$('recordStatus').textContent='录音中，切换句子或页面会自动停止并保存。';
 }catch(e){$('recordStatus').textContent='无法使用麦克风，请检查权限或设备后重试';}finally{$('record').disabled=false;}
}
$('previous').onclick=()=>choose(cur-1);$('next').onclick=()=>choose(cur+1);$('play').onclick=()=>run?stop():start();$('record').onclick=record;
$('replay').onclick=()=>{if(!recUrl)return;stop();endRecording();stopAudio();audio=new Audio(recUrl);audio.play().catch(()=>{$('recordStatus').textContent='录音回放失败，请下载后播放';});};
$('favorite').onclick=()=>{state.favorites[cur]=!state.favorites[cur];save();renderLists();$('favorite').textContent=state.favorites[cur]?'★ 已收藏':'☆ 收藏本句';};
$('mastery').onchange=()=>{state.mastery[cur]=$('mastery').value;save();renderLists();};
$('note').oninput=()=>{state.notes[cur]=$('note').value;save();};
for(const id of ['dictation','fillInput'])$(id).oninput=()=>{state.drafts[cur]??={};state.drafts[cur][id]=$(id).value;save();};
$('dictAnswer').onclick=()=>$('dictResult').hidden=false;$('fillAnswer').onclick=()=>$('fillResult').hidden=false;
for(const id of ['sentences','reviews'])$(id).onclick=e=>{const b=e.target.closest('button[data-index]');if(b)choose(Number(b.dataset.index));};
function tab(review){stop();endRecording();stopAudio();$('reviewPanel').hidden=!review;$('reviewTab').classList.toggle('active',review);$('practiceTab').classList.toggle('active',!review);}
$('reviewTab').onclick=()=>tab(true);$('practiceTab').onclick=()=>tab(false);
function hint(){$('modeHint').textContent=$('mode').value==='echo'?'听完一句后，留出“当前语速句长 + 句间留白”的时间自己说。':'跟着原声稍滞后开口，模仿节奏。每轮后按设置留白。';}
for(const id of ['mode','rate','repeat','gap','autoNext','subtitle']){
 if(state.settings[id]!=null){if(id==='autoNext')$(id).checked=!!state.settings[id];else if([...$(id).options].some(o=>o.value===String(state.settings[id])))$(id).value=state.settings[id];}
 $(id).onchange=()=>{if(id!=='subtitle')stop('设置已更新');state.settings[id]=id==='autoNext'?$(id).checked:$(id).value;video.playbackRate=Number($('rate').value);save();hint();if(id==='subtitle')render();};
}
video.playbackRate=Number($('rate').value);
document.addEventListener('visibilitychange',()=>{if(document.hidden){stop('已暂停');endRecording();stopAudio();save();}});
window.addEventListener('pagehide',()=>{stop();endRecording();save();});
hint();render();$('practiceTab').classList.add('active');
