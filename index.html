<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日英语跟读 · Friends</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1a1a1a;--ink2:#555;--ink3:#999;
  --paper:#faf9f7;--paper2:#f4f2ef;--paper3:#ece8e2;
  --border:#ddd8ce;--border2:#ccc5b8;
  --blue-bg:#daeefb;--blue-bd:#93c8f0;--blue-text:#2a7db5;
  --pink-bg:#fce4ef;--pink-bd:#f4a7bf;--pink-text:#c2547a;
  --green-bg:#e2f5ea;--green-bd:#7dcc99;--green-text:#2d8a52;
  --red-bg:#fdecea;--red-bd:#f5a6a0;--red-text:#c0392b;
  --hi:#f5c842;/* karaoke highlight */
  --r:10px;--rs:20px;
  --font:'Noto Serif SC',serif;--mono:'DM Mono',monospace;
  --shadow:0 2px 10px rgba(0,0,0,.07);
}
html,body{height:100%;background:var(--paper);color:var(--ink);font-family:var(--font)}

/* ── HEADER ── */
.hdr{display:flex;align-items:center;gap:12px;padding:11px 20px;background:var(--paper);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.logo{font-size:15px;font-weight:600;color:var(--blue-text)}
.vtitle{flex:1;font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vmeta{font-size:11px;color:var(--ink3)}

/* ── LAYOUT ── */
.layout{display:grid;grid-template-columns:1fr 1fr;height:calc(100vh - 49px);overflow:hidden}
.left{display:flex;flex-direction:column;border-right:1px solid var(--border);overflow:hidden}
.right{display:flex;flex-direction:column;overflow:hidden}

/* ── VIDEO ── */
.vid-wrap{position:relative;padding-bottom:56.25%;background:#000;flex-shrink:0}
.vid-wrap #ytp{position:absolute;top:0;left:0;width:100%;height:100%}
.vpbar{height:3px;background:var(--paper3);flex-shrink:0}
.vpfill{height:100%;background:var(--blue-text);transition:width .3s}

/* ── VIDEO CONTROLS ── */
.vid-ctrl{display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;background:var(--paper2);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.vbtn{display:inline-flex;align-items:center;gap:4px;padding:5px 15px;border-radius:var(--rs);border:1px solid var(--blue-bd);background:var(--blue-bg);color:var(--blue-text);font-size:12px;font-family:var(--font);cursor:pointer;transition:all .15s;white-space:nowrap;font-weight:500}
.vbtn:hover{filter:brightness(.93)}
.vbtn.pink{border-color:var(--pink-bd);background:var(--pink-bg);color:var(--pink-text)}
.vbtn.plain{border-color:var(--border2);background:var(--paper);color:var(--ink2)}
.vbtn.playbig{font-size:15px;padding:5px 18px;border-color:var(--pink-bd);background:var(--pink-bg);color:var(--pink-text)}
.vbtn.active-pink{border-color:var(--pink-text);background:var(--pink-text);color:#fff}

/* ── AUTOPAUSE ROW (below vid ctrl, only visible when blind) ── */
.ap-row{display:none;align-items:center;justify-content:center;gap:10px;padding:7px 14px;background:var(--paper2);border-bottom:1px solid var(--border);font-size:12px;color:var(--ink2);flex-shrink:0}
.ap-row.show{display:flex}
.tog{position:relative;width:34px;height:18px}
.tog input{opacity:0;width:0;height:0}
.tsl{position:absolute;inset:0;background:var(--border2);border-radius:99px;cursor:pointer;transition:.2s}
.tsl:before{content:'';position:absolute;width:14px;height:14px;left:2px;bottom:2px;background:#fff;border-radius:50%;transition:.2s}
.tog input:checked+.tsl{background:var(--pink-text)}
.tog input:checked+.tsl:before{transform:translateX(16px)}

/* ── LEFT BLANK (below controls) ── */
.left-blank{flex:1;background:var(--paper);display:flex;align-items:center;justify-content:center}
.left-blank-hint{font-size:13px;color:var(--ink3)}

/* ── RIGHT TABS ── */
.tabs{display:flex;background:var(--paper2);border-bottom:1px solid var(--border);flex-shrink:0}
.tab{flex:1;padding:9px 4px;text-align:center;font-size:13px;font-weight:500;color:var(--ink3);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.tab:hover{color:var(--ink2)}
.tab.active{color:var(--blue-text);border-bottom-color:var(--blue-text);background:var(--paper)}

/* ── VIEWS ── */
.view{display:none;flex:1;overflow:hidden;flex-direction:column}
.view.show{display:flex}

/* ── SUBTITLE VIEW ── */
.sub-lang-bar{display:flex;align-items:center;gap:6px;padding:7px 14px;background:var(--paper2);border-bottom:1px solid var(--border);flex-shrink:0}
.sub-lang-label{font-size:11px;color:var(--ink3)}
.slbtn{padding:3px 13px;border-radius:var(--rs);border:1px solid var(--blue-bd);background:var(--blue-bg);color:var(--blue-text);font-size:11px;cursor:pointer;transition:all .15s;font-weight:500}
.slbtn.active{background:var(--pink-bg);border-color:var(--pink-bd);color:var(--pink-text)}

/* subtitle list: karaoke scroll */
.sub-area{flex:1;overflow-y:auto;background:var(--paper)}
.sub-chunk{padding:13px 17px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s}
.sub-chunk:hover{background:var(--paper2)}
.sub-chunk.cur{background:var(--blue-bg);border-left:3px solid var(--blue-text)}
.sub-num{font-size:10px;color:var(--ink3);font-family:var(--mono);margin-bottom:4px}
.sub-en{font-size:14px;line-height:1.8;font-family:var(--mono)}
.sub-cn{font-size:12px;color:var(--ink2);margin-top:2px;line-height:1.5}
/* word highlight */
.w{display:inline}
.w.lit{background:var(--hi);border-radius:2px;padding:0 1px}

/* ── SHADOW VIEW ── */
.sm-bar{display:flex;gap:6px;padding:9px 14px;background:var(--paper2);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.smbtn{padding:4px 14px;border-radius:var(--rs);border:1px solid var(--blue-bd);background:var(--blue-bg);color:var(--blue-text);font-size:12px;cursor:pointer;transition:all .15s;font-weight:500}
.smbtn.active{background:var(--pink-bg);border-color:var(--pink-bd);color:var(--pink-text)}

/* nav mini box (cont/timed top) */
.nav-box{display:flex;align-items:center;gap:8px;margin:10px 14px 0;padding:8px 12px;background:var(--paper2);border:1px solid var(--border);border-radius:var(--r);flex-shrink:0}
.nav-info{font-size:12px;color:var(--ink3);flex:1;text-align:center}

.sm-panel{display:none;flex:1;overflow-y:auto;padding:12px 14px}
.sm-panel.show{display:block}
/* cont/timed: full height list */
.sm-panel-list{display:none;flex:1;flex-direction:column;overflow:hidden}
.sm-panel-list.show{display:flex}
.shadow-list{flex:1;overflow-y:auto}

/* cards */
.card{background:var(--paper);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.card.cur{border-color:var(--blue-text);background:var(--blue-bg)}
.card-meta{font-size:10px;color:var(--ink3);font-family:var(--mono);margin-bottom:5px}
.card-en{font-size:14px;font-family:var(--mono);line-height:1.8;margin-bottom:4px}
.card-cn{font-size:12px;color:var(--ink2);margin-bottom:10px}
.card-btns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cbtn{display:inline-flex;align-items:center;gap:4px;padding:5px 14px;border-radius:var(--rs);border:1px solid var(--blue-bd);background:var(--blue-bg);color:var(--blue-text);font-size:12px;font-family:var(--font);cursor:pointer;transition:all .15s;white-space:nowrap;font-weight:500}
.cbtn:hover{filter:brightness(.93)}
.cbtn.pink{border-color:var(--pink-bd);background:var(--pink-bg);color:var(--pink-text)}
.cbtn.green{border-color:var(--green-bd);background:var(--green-bg);color:var(--green-text)}
.cbtn.red{border-color:var(--red-bd);background:var(--red-bg);color:var(--red-text)}
.rec-st{font-size:11px;color:var(--ink3)}
.rec-dot{width:7px;height:7px;background:var(--red-text);border-radius:50%;display:inline-block;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* cont/timed rows */
.srow{padding:12px 17px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s}
.srow:hover{background:var(--paper2)}
.srow.cur{background:var(--blue-bg);border-left:3px solid var(--blue-text)}
.srow-num{font-size:10px;color:var(--ink3);font-family:var(--mono);margin-bottom:3px}
.srow-mask{font-size:14px;font-family:var(--mono);color:var(--border2);letter-spacing:2px;user-select:none}
/* timed countdown */
.cd-wrap{margin-top:8px}
.cd-bar{height:4px;background:var(--border);border-radius:99px;overflow:hidden}
.cd-fill{height:100%;background:linear-gradient(90deg,var(--pink-text),var(--blue-text));border-radius:99px;transition:width .1s linear}
.cd-label{font-size:11px;color:var(--pink-text);margin-bottom:3px}

/* dictate / fill */
.dc-card{background:var(--paper);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.dc-meta{font-size:10px;color:var(--ink3);font-family:var(--mono);margin-bottom:4px}
.dc-prompt{font-size:12px;color:var(--ink2);margin-bottom:8px;line-height:1.5}
.dc-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.dc-input{flex:1;padding:7px 12px;border:1px solid var(--border2);border-radius:var(--rs);background:var(--paper2);font-size:13px;font-family:var(--mono);color:var(--ink);outline:none;transition:border .15s}
.dc-input:focus{border-color:var(--blue-text);background:#fff}
.dc-answer{font-size:13px;font-family:var(--mono);color:var(--green-text);margin-top:6px;padding:7px 11px;background:var(--green-bg);border-radius:8px;display:none;line-height:1.6}
.dc-answer.show{display:block}
.blank-wd{display:inline-block;min-width:50px;border-bottom:2px solid var(--pink-text);color:transparent;background:var(--pink-bg);border-radius:3px;padding:0 3px;font-family:var(--mono);font-size:14px}
.blank-wd.rev{color:var(--pink-text)}

/* note */
.note-card{background:var(--paper);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.note-input{width:100%;padding:7px 11px;border:1px solid var(--border2);border-radius:8px;background:var(--paper2);font-size:13px;font-family:var(--font);color:var(--ink);outline:none;resize:vertical;min-height:55px;margin-top:6px}
.note-input:focus{border-color:var(--blue-text);background:#fff}
.note-saved{font-size:11px;color:var(--green-text);margin-top:3px;display:none}

/* sub-mode bar (dictate/fill) */
.dc-bar{display:flex;gap:6px;padding:9px 14px;background:var(--paper2);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.dc-scroll{flex:1;overflow-y:auto;padding:12px 14px}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}

@media(max-width:768px){
  .layout{grid-template-columns:1fr;height:auto;overflow:visible}
  .left{border-right:none;border-bottom:1px solid var(--border)}
  .right{min-height:60vh}
  .sm-panel-list{min-height:40vh}
}
</style>
</head>
<body>

<div class="hdr">
  <div class="logo">每日英语</div>
  <div class="vtitle">Monica Tries to Keep Phoebe Away from Her Ex — Friends</div>
  <div class="vmeta">54句</div>
</div>

<div class="layout">
  <!-- ══ LEFT ══ -->
  <div class="left">
    <div class="vid-wrap">
      <!-- 本地视频：将视频文件与本网页放在同一目录，文件名改为 video.mp4 即可 -->
      <video id="ytp" controls style="position:absolute;top:0;left:0;width:100%;height:100%;background:#000" preload="metadata">
        <source src="video.mp4" type="video/mp4">
        您的浏览器不支持视频播放。
      </video>
    </div>
    <div class="vpbar"><div class="vpfill" id="vpf" style="width:0%"></div></div>

    <!-- 视频控制：字幕 | 上一句 | 播放 | 下一句 | 盲听，居中 -->
    <div class="vid-ctrl">
      <button class="vbtn" id="btn-sub" onclick="cycleSubLang()">📄 字幕</button>
      <button class="vbtn plain" onclick="vidGo(-1)">⏮ 上一句</button>
      <button class="vbtn playbig" id="btn-play" onclick="togglePlay()">▶</button>
      <button class="vbtn plain" onclick="vidGo(1)">下一句 ⏭</button>
      <button class="vbtn pink" id="btn-blind" onclick="toggleBlind()">👂 盲听</button>
    </div>

    <!-- 单句自动暂停开关，仅盲听时显示 -->
    <div class="ap-row" id="ap-row">
      单句播放完自动暂停
      <label class="tog"><input type="checkbox" id="ap-tog" onchange="setAutoPause(this.checked)"><span class="tsl"></span></label>
    </div>

    <!-- 左侧空白区 -->
    <div class="left-blank">
      <div class="left-blank-hint" id="left-hint">点击字幕按钮在右侧显示字幕</div>
    </div>
  </div>

  <!-- ══ RIGHT ══ -->
  <div class="right">
    <div class="tabs">
      <div class="tab active" id="tab-subtitle" onclick="setTab('subtitle')">字幕</div>
      <div class="tab" id="tab-shadow" onclick="setTab('shadow')">跟读</div>
      <div class="tab" id="tab-dictate" onclick="setTab('dictate')">听写</div>
      <div class="tab" id="tab-fill" onclick="setTab('fill')">挖空</div>
      <div class="tab" id="tab-note" onclick="setTab('note')">笔记</div>
    </div>

    <!-- 字幕 view -->
    <div class="view show" id="view-subtitle">
      <div class="sub-lang-bar">
        <span class="sub-lang-label">字幕模式：</span>
        <button class="slbtn active" id="slb-en" onclick="setSubLang('en')">英文</button>
        <button class="slbtn" id="slb-bi" onclick="setSubLang('bi')">双语</button>
      </div>
      <div class="sub-area" id="sub-area"></div>
    </div>

    <!-- 跟读 view -->
    <div class="view" id="view-shadow">
      <div class="sm-bar">
        <button class="smbtn active" id="sm-single" onclick="setSM('single')">单句跟读</button>
        <button class="smbtn" id="sm-timed" onclick="setSM('timed')">限时跟读</button>
      </div>

      <!-- 单句跟读 -->
      <div class="sm-panel show" id="smp-single">
        <div id="single-content"></div>
      </div>

      <!-- 限时跟读 -->
      <div class="sm-panel-list" id="smp-timed">
        <!-- 导航框在顶部 -->
        <div class="nav-box">
          <button class="cbtn" onclick="timedGo(-1)">⏮ 上一句</button>
          <button class="cbtn pink" id="timed-btn" onclick="toggleTimed()">▶ 开始</button>
          <button class="cbtn" onclick="timedGo(1)">下一句 ⏭</button>
        </div>
        <div style="display:flex;gap:8px;justify-content:center;padding:6px 14px 0;flex-shrink:0">
          <button class="smbtn active" id="tcn-show" onclick="setTimedCN('show')">显示中文</button>
          <button class="smbtn" id="tcn-hide" onclick="setTimedCN('hide')">隐藏中文</button>
        </div>
        <div style="height:8px;flex-shrink:0"></div>
        <div class="shadow-list" id="timed-list"></div>
      </div>
    </div>

    <!-- 听写 view -->
    <div class="view" id="view-dictate">
      <div class="dc-bar">
        <button class="smbtn active" id="dm-cn" onclick="setDM('cn')">显示中文</button>
        <button class="smbtn" id="dm-none" onclick="setDM('none')">隐藏中文</button>
      </div>
      <div class="dc-scroll" id="dictate-content"></div>
    </div>

    <!-- 挖空 view -->
    <div class="view" id="view-fill">
      <div class="dc-bar">
        <button class="smbtn active" id="fm-cn" onclick="setFM('cn')">显示中文</button>
        <button class="smbtn" id="fm-none" onclick="setFM('none')">隐藏中文</button>
      </div>
      <div class="dc-scroll" id="fill-content"></div>
    </div>

    <!-- 笔记 view -->
    <div class="view" id="view-note">
      <div class="dc-scroll" id="note-content"></div>
    </div>
  </div>
</div>

<script>
// ═══════════════ DATA ═══════════════
const chunks=[
  {text:"God, I wish Mike were here.",cn:"天啊，我多希望迈克在这里。",t:0.0,end:3.2},
  {text:"Okay, if Mike were here, what would the two of you be doing?",cn:"好吧，如果迈克在这里，你们俩会做什么？",t:3.2,end:7.4},
  {text:"What are you, animals? It's 4:00 in the afternoon.",cn:"你们是什么人啊，禽兽吗？现在才下午四点。",t:7.68,end:11.135},
  {text:"We got to call him. Just just to talk to him. There's no harm in that.",cn:"我们得给他打电话。就只是聊聊天。这有什么坏处呢。",t:11.88,end:15.96},
  {text:"Phoebe, that's how it starts. I don't need to eat the cake, I'll just smell the icing.",cn:"菲比，就是这样开始的。我不需要吃蛋糕，我就闻闻糖霜。",t:15.96,end:21.16},
  {text:"Well, not just a little sliver, or okay, just a a slice or two. You know, the next thing you know, you're 210 lb and you get wedged in going down the tunnel slide.",cn:"结果不只是一小片，好吧，就一两片。你知道的，下一刻你就胖到两百多磅，卡在隧道滑梯里出不来。",t:21.16,end:29.28},
  {text:"Phoebe, I I I know this is hard. But look, if you talk to him, then you're going to want to see him.",cn:"菲比，我知道这很难。但你听着，如果你跟他说话，你就会想见他。",t:32.439,end:36.72},
  {text:"And if you see him, you're going to want to get back together with him. And I know that's not what you want.",cn:"如果你见了他，你就会想跟他复合。而我知道那不是你真正想要的。",t:36.72,end:44.48},
  {text:"All right, so give me your phone.",cn:"好吧，那把你的电话给我。",t:45.08,end:48.0},
  {text:"Here. And now your cell.",cn:"给你。现在把手机也给我。",t:48.0,end:52.12},
  {text:"Okay.",cn:"好的。",t:52.12,end:54.88},
  {text:"Here.",cn:"给你。",t:58.16,end:62.935},
  {text:"This is your cell phone.",cn:"这是你的手机。",t:66.72,end:69.52},
  {text:"Yes. This is your current cell phone.",cn:"是的。这是你现在用的手机。",t:69.52,end:74.76},
  {text:"Yes. It reminds me of a simpler time.",cn:"是的。它让我想起了一段更简单的时光。",t:74.76,end:79.32},
  {text:"Phoebe, where's your purse?",cn:"菲比，你的包呢？",t:79.68,end:84.64},
  {text:"Hey. No. No. Give it to me. You can't have it.",cn:"嘿，不行。不行。把它给我。你不能留着它。",t:84.64,end:88.16},
  {text:"Give it to me. No.",cn:"给我。不要。",t:88.16,end:91.04},
  {text:"I'll go in there. Oh, yeah. Phoebe, come here. No. Give it to me. No.",cn:"我进去了。哦，好啊。菲比，过来。不要。给我。不要。",t:92.56,end:98.6},
  {text:"Damn you, Monica Geller-Bing.",cn:"该死的，莫妮卡·盖勒-宾。",t:102.24,end:106.12},
  {text:"So, Phoebe, why are there men's shoes by the door? Those are my shoes.",cn:"菲比，为什么门口有双男士鞋？那是我的鞋。",t:106.12,end:111.96},
  {text:"Oh. Well, when you get over this breakup, we need to go shopping.",cn:"哦，好吧。等你走出这段分手，我们得去购物了。",t:111.96,end:116.52},
  {text:"Look, Monica, I really appreciate you checking in on me, but I'm actually feeling a lot better.",cn:"莫妮卡，我真的很感谢你来看我，但我其实已经好多了。",t:116.52,end:122.04},
  {text:"You are? Yeah, and I I just kind of want to be alone right now.",cn:"真的吗？是的，我只是想一个人待着。",t:122.04,end:126.44},
  {text:"Who's that? I ordered Chinese food.",cn:"那是谁？我点了中餐外卖。",t:127.48,end:132.399},
  {text:"What are the chances?",cn:"这也太巧了吧？",t:133.92,end:136.896},
  {text:"1 billion Chinese people and they said Mike.",cn:"十亿中国人，他们偏偏说的是迈克。",t:137.16,end:142.12},
  {text:"What are you doing here? Phoebe called me. Phoebe. I'm sorry, I broke down. I wanted to see him.",cn:"你来这里干什么？菲比叫我来的。菲比！对不起，我撑不住了。我想见他。",t:142.24,end:147.68},
  {text:"Damn it, Phoebe. How how did you even call him? There's a speaker phone on the base unit. Base unit? Think, Monica, think.",cn:"该死的，菲比。你怎么给他打的电话？底座上有扩音功能。底座？动动脑子，莫妮卡，动动脑子。",t:147.68,end:154.2},

function fmtT(s){const m=Math.floor(s/60);return`${m}:${String(Math.floor(s%60)).padStart(2,'0')}`;}
function chunkDur(i){return Math.max(0.5, chunks[i].end - chunks[i].t);}
function getIdx(t){let r=0;for(let i=0;i<chunks.length;i++){if(t>=chunks[i].t)r=i;else break;}return r;}

// word-by-word html with estimated timing per word
function wordsHtml(text,chunkIdx){
  const words=text.split(' ');
  const dur=chunkDur(chunkIdx);
  const perWord=dur/words.length;
  return words.map((w,wi)=>`<span class="w" data-ci="${chunkIdx}" data-wi="${wi}" data-t="${(chunks[chunkIdx].t+wi*perWord).toFixed(2)}">${w}</span>`).join(' ');
}

function pickBlanks(text){
  const ws=text.split(' ');
  // try prebuilt map first
  const key=Object.keys(_blankMap).find(k=>text.includes(k.slice(0,20)));
  if(key){
    const targets=_blankMap[key];
    const idxs=[];
    targets.forEach(t=>{
      const ti=ws.findIndex(w=>w.replace(/[^a-zA-Z']/g,'').toLowerCase()===t.toLowerCase());
      if(ti>=0&&!idxs.includes(ti))idxs.push(ti);
    });
    if(idxs.length)return idxs.slice(0,2).sort((a,b)=>a-b);
  }
  // fallback: score-based
  const scored=ws.map((raw,i)=>{
    const w=raw.replace(/[^a-zA-Z']/g,'').toLowerCase();
    if(w.length<3)return{i,score:-1};
    let s=0;
    if(!_fw.has(w))s+=3;
    if(w.length>=6)s+=2;else if(w.length>=4)s+=1;
    if(/ing$|tion$|ness$|ment$|ful$|less$|ize$|ise$/.test(w))s+=2;
    if(/ed$/.test(w)&&w.length>4)s+=1;
    if(i===0)s-=1;
    return{i,score:s};
  }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
  if(!scored.length){const f=ws.findIndex(w=>w.replace(/[^a-zA-Z]/g,'').length>=4);return[f<0?0:f];}
  if(scored.length===1)return[scored[0].i];
  const first=scored[0];
  const second=scored.find(x=>x.i!==first.i&&Math.abs(x.i-first.i)>1)||scored[1];
  return[first.i,second.i].sort((a,b)=>a-b);
}

// ═══════════════ LOCAL VIDEO PLAYER ═══════════════
// 封装本地 <video> 元素，使接口与原 YT.player 兼容
function initLocalPlayer(){
  const v=document.getElementById('ytp');
  if(!v)return;
  // 封装对象
  player={
    _v:v,
    seekTo(t){v.currentTime=t;},
    playVideo(){v.play();},
    pauseVideo(){v.pause();},
    getCurrentTime(){return v.currentTime;},
    getPlaybackRate(){return v.playbackRate;}
  };
  v.addEventListener('play',()=>{playing=true;document.getElementById('btn-play').textContent='⏸';startSync();});
  v.addEventListener('pause',()=>{playing=false;document.getElementById('btn-play').textContent='▶';stopSync();if(timedRunning&&!_timedCD)_stopTimed();});
  v.addEventListener('ended',()=>{playing=false;document.getElementById('btn-play').textContent='▶';stopSync();});
}
// 页面加载后初始化本地播放器（通过 window load 事件触发）
function startSync(){
  stopSync();
  syncTimer=setInterval(()=>{
    if(!player)return;
    const t=player.getCurrentTime();
    const idx=getIdx(t);
    // update karaoke word highlight (subtitle view only)
    if(modeTab==='subtitle')highlightWord(t);
    if(idx!==cur){
      cur=idx;
      onCurChange();
      // blind autopause: pause at sentence boundary
      if(isBlind&&autoPause){
        clearTimeout(window._apTimer);
        player.pauseVideo();
      }
    }
  },80);
}
function stopSync(){clearInterval(syncTimer);}

function onCurChange(){
  document.getElementById('vpf').style.width=Math.round((cur+1)/chunks.length*100)+'%';
  if(modeTab==='subtitle')scrollSubTo(cur);
  if(modeTab==='shadow'){
    if(sm==='timed'&&!timedRunning){timedCur=cur;renderTimedList();}
  }
}

// ═══════════════ LEFT VIDEO CONTROLS ═══════════════
function vidGo(d){
  const n=cur+d;
  if(n>=0&&n<chunks.length){
    cur=n;
    if(player){player.seekTo(chunks[n].t,true);player.playVideo();}
    onCurChange();
  }
}
function togglePlay(){if(!player)return;if(modeTab==='shadow'&&sm==='timed'&&timedRunning){_stopTimed();return;}playing?player.pauseVideo():player.playVideo();}

// left btn: cycle subtitle lang AND sync right subtitle view
// off → en → bi → off; button label changes
function cycleSubLang(){
  const states=['off','en','bi'];
  const labels={off:'📄 字幕',en:'📄 英文',bi:'📄 双语'};
  const cur_i=states.indexOf(subLang);
  subLang=states[(cur_i+1)%states.length];
  const btn=document.getElementById('btn-sub');
  btn.textContent=labels[subLang];
  btn.classList.toggle('active-pink',subLang!=='off');
  // sync right subtitle view lang buttons
  if(subLang!=='off'){
    document.getElementById('slb-en').classList.toggle('active',subLang==='en');
    document.getElementById('slb-bi').classList.toggle('active',subLang==='bi');
    // switch to subtitle tab if not already there
    if(modeTab!=='subtitle')setTab('subtitle');
  }
  // if blind mode ON, hide subtitle regardless
  if(isBlind)return;
  renderSubList();
}

// ═══════════════ BLIND ═══════════════
function setAutoPause(checked){
  autoPause=checked;
  // 如果当前正在播放且开关打开，立即暂停到当前句末
  if(autoPause&&player&&playing){
    // 直接暂停视频以切换到单句模式
    const t=player.getCurrentTime();
    const idx=getIdx(t);
    const end=chunks[idx].t+chunkDur(idx);
    const remain=(end-t)*1000+300;
    clearTimeout(window._apTimer);
    window._apTimer=setTimeout(()=>{if(player&&autoPause)player.pauseVideo();},Math.max(0,remain));
  } else if(!autoPause){
    clearTimeout(window._apTimer);
    // 如果视频被暂停且应该继续播放，恢复播放
    if(player&&!playing&&isBlind){
      player.playVideo();
    }
  }
}
function toggleBlind(){
  isBlind=!isBlind;
  document.getElementById('btn-blind').classList.toggle('active-pink',isBlind);
  document.getElementById('ap-row').classList.toggle('show',isBlind);
  if(!isBlind){
    // 关闭盲听：重置自动暂停，恢复播放
    autoPause=false;
    document.getElementById('ap-tog').checked=false;
    clearTimeout(window._apTimer);
  }
  // hide/show subtitle area
  const sa=document.getElementById('sub-area');
  if(isBlind){
    sa.style.visibility='hidden';
  } else {
    sa.style.visibility='visible';
    renderSubList();
  }
}

function renderSubList(){
  if(subLang==='off'){

  Array.from(area.children).forEach((el,j)=>el.classList.toggle('cur',j===i));

function setSubLang(l){
  subLang=l;

  leftBtn.classList.add('active-pink');

// karaoke word highlight - uses actual video time + SRT end timestamp for accurate per-word sync
let lastLitWord=null;
function highlightWord(t){
  if(subLang==='off')return;
  const ci=getIdx(t);
  const chunk=chunks[ci];
  const dur=chunk.end - chunk.t;
  const words=chunk.text.split(' ');
  const count=words.length;
  const elapsed=Math.max(0, t - chunk.t);
  // only highlight while within the chunk's own time window
  if(t > chunk.end + 0.1){
    if(lastLitWord){lastLitWord.classList.remove('lit');lastLitWord=null;}
    return;
  }
  const wi=Math.min(count-1, Math.floor(elapsed/dur*count));
  const senEl=document.getElementById('sen-'+ci);
  if(!senEl)return;
  const wordEls=senEl.querySelectorAll('.w');
  const target=wordEls[wi]||null;
  if(target===lastLitWord)return;
  if(lastLitWord)lastLitWord.classList.remove('lit');
  if(target){target.classList.add('lit');lastLitWord=target;}
}

// ═══════════════ TABS ═══════════════
function setTab(t){
  // 停止旧标签的运行状态
  if(modeTab==='shadow'){
    if(sm==='timed'){if(timedRunning)_stopTimed();else clearTimed();}
    if(sm==='single'){Object.keys(singlePauseTimers).forEach(k=>clearTimeout(singlePauseTimers[k]));singlePauseTimers={};}
    if(player&&playing)player.pauseVideo();
  }
  modeTab=t;
  ['subtitle','shadow','dictate','fill','note'].forEach(m=>{
    document.getElementById('tab-'+m).classList.toggle('active',m===t);
    document.getElementById('view-'+m).classList.toggle('show',m===t);
  });
  if(t==='subtitle')renderSubList();
  else if(t==='shadow')renderSM();
  else if(t==='dictate')renderDictate();
  else if(t==='fill')renderFill();
  else renderNote();
}

// ═══════════════ SHADOW MODE ═══════════════
function setSM(m){
  // 停止旧模式的所有计时器/录音/播放
  if(sm==='timed'){if(timedRunning)_stopTimed();else clearTimed();}
  if(sm==='single'){
    // 清除所有单句暂停计时器
    Object.keys(singlePauseTimers).forEach(k=>clearTimeout(singlePauseTimers[k]));
    singlePauseTimers={};
  }
  if(sm==='cont'){
    // 暂停播放
  }
  // 如果视频正在播放，暂停（切换模式时停止当前播放）
  if(player&&playing)player.pauseVideo();
  sm=m;
  ['single','timed'].forEach(s=>document.getElementById('sm-'+s).classList.toggle('active',s===m));
  renderSM();
}
function renderSM(){
  document.getElementById('smp-single').classList.toggle('show',sm==='single');

      <div class="card-btns">
        <button class="cbtn pink" onclick="singlePlay(${i})">▶ 播放</button>
        <button class="cbtn" id="recbtn${i}" onclick="toggleRec(${i})">🎙 录音</button>
        <button class="cbtn green" id="pbbtn${i}" ${recBlobs[i]?'':'disabled style="opacity:.4;cursor:not-allowed"'} onclick="playRec(${i})">↩ 回放</button>
        <span class="rec-st" id="recst${i}"></span>
      </div>
    </div>`).join('');
}
// single play: play one sentence then pause (independent of left player)
function singlePlay(i){
  if(!player)return;
  clearTimeout(singlePauseTimers[i]);
  player.seekTo(chunks[i].t,true);
  player.playVideo();
  const dur=chunkDur(i);
  singlePauseTimers[i]=setTimeout(()=>{if(player)player.pauseVideo();},dur*1000+300);
}

// recording
let recMR={},recChunks2={};
function toggleRec(i){
  const btn=document.getElementById('recbtn'+i);
  const st=document.getElementById('recst'+i);
  if(recMR[i]&&recMR[i].state==='recording'){
    recMR[i].stop();
  } else {
    recChunks2[i]=[];
    navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
      const mr=new MediaRecorder(stream);
      recMR[i]=mr;
      mr.ondataavailable=e=>recChunks2[i].push(e.data);
      mr.onstop=()=>{
        recBlobs[i]=new Blob(recChunks2[i],{type:'audio/webm'});
        stream.getTracks().forEach(t=>t.stop());
        btn.innerHTML='🎙 录音';btn.className='cbtn';
        st.textContent='录音完成 ✓';
        const pb=document.getElementById('pbbtn'+i);
        if(pb){pb.removeAttribute('disabled');pb.style.opacity='1';pb.style.cursor='pointer';}
      };
      mr.start();
      btn.innerHTML='<span class="rec-dot"></span> 停止';btn.className='cbtn red';
      st.textContent='录音中...';
    }).catch(()=>{st.textContent='无麦克风权限';});
  }
}
function playRec(i){if(recBlobs[i])new Audio(URL.createObjectURL(recBlobs[i])).play();}

// ── TIMED ──
function _stopTimed(){
  clearTimed();
  timedRunning=false;_timedCD=false;
  const btn=document.getElementById('timed-btn');
  if(btn)btn.textContent='▶ 开始';
  // hide any visible countdown bar
  document.querySelectorAll('.cd-wrap').forEach(el=>el.style.display='none');
}
function renderTimedList(){
  const el=document.getElementById('timed-list');
  el.innerHTML='';
  chunks.forEach((c,i)=>{
    const d=document.createElement('div');
    d.className='srow'+(i===timedCur?' cur':'');
    // hide mode: hide both en and cn; show mode: show cn only
    const enStyle=timedCNMode==='hide'?'display:none':'';
    const cnHtml=timedCNMode==='show'?`<div style="font-size:12px;color:var(--ink2);margin-top:2px;line-height:1.5">${c.cn}</div>`:'';
    d.innerHTML=`<div class="srow-num">#${String(i+1).padStart(2,'0')} · ${fmtT(c.t)}</div>
      <div style="font-size:14px;font-family:var(--mono);line-height:1.7;margin:2px 0 4px;color:var(--ink);${enStyle}">${c.text}</div>
      ${cnHtml}
      <div class="cd-wrap" id="cdw-${i}" style="display:none">
        <div class="cd-label">跟读倒计时</div>
        <div class="cd-bar"><div class="cd-fill" id="cdf-${i}" style="width:100%"></div></div>
      </div>`;
    d.onclick=()=>{if(timedRunning)_stopTimed();timedCur=i;cur=i;renderTimedList();};
    el.appendChild(d);
  });
  const btn=document.getElementById('timed-btn');
  if(btn)btn.textContent=timedRunning?'⏸ 暂停':'▶ 开始';
  const ae=el.children[timedCur];
  if(ae)setTimeout(()=>ae.scrollIntoView({block:'nearest',behavior:'smooth'}),50);
}
function timedGo(d){
  if(timedRunning)_stopTimed();
  const n=timedCur+d;
  if(n>=0&&n<chunks.length){timedCur=n;cur=n;renderTimedList();}
}
function setTimedCN(m){
  timedCNMode=m;
  document.getElementById('tcn-show').classList.toggle('active',m==='show');
  document.getElementById('tcn-hide').classList.toggle('active',m==='hide');
  renderTimedList();
}
function clearTimed(){clearTimeout(timedTimer);clearInterval(cdInterval);}
function toggleTimed(){timedRunning?_stopTimed():startTimed();}
function startTimed(){
  if(!player)return;
  clearTimed();
  timedRunning=true;_timedCD=false;
  const btn=document.getElementById('timed-btn');
  if(btn)btn.textContent='⏸ 暂停';
  const i=timedCur;
  const playDur=chunkDur(i);
  // hide bar during playback phase
  const wrap=document.getElementById('cdw-'+i);
  if(wrap)wrap.style.display='none';
  player.seekTo(chunks[i].t,true);
  player.playVideo();
  timedTimer=setTimeout(()=>{
    if(!timedRunning)return;
    _timedCD=true;
    player.pauseVideo();
    // beep
    try{const ac=new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=880;g.gain.value=0.3;o.start();setTimeout(()=>{g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.25);setTimeout(()=>o.stop(),250);},0);}catch(e){}
    // show countdown bar on SAME row
    if(wrap){wrap.style.display='block';}
    const fill=document.getElementById('cdf-'+i);
    if(fill)fill.style.width='100%';
    const total=(playDur+3)*1000;
    const t0=Date.now();
    cdInterval=setInterval(()=>{
      if(!timedRunning){clearInterval(cdInterval);return;}
      const pct=Math.max(0,100-(Date.now()-t0)/total*100);
      if(fill)fill.style.width=pct+'%';
      if(pct<=0){
        clearInterval(cdInterval);
        _timedCD=false;
        if(wrap)wrap.style.display='none';
        if(timedCur<chunks.length-1){
          timedCur++;cur=timedCur;
          renderTimedList();
          setTimeout(()=>startTimed(),100);
        } else {
          timedRunning=false;
          const b=document.getElementById('timed-btn');
          if(b)b.textContent='▶ 开始';
        }
      }
    },50);
  },playDur*1000+100);
}

// ═══════════════ DICTATE ═══════════════
function setDM(m){
  dm=m;
  document.getElementById('dm-cn').classList.toggle('active',m==='cn');
  document.getElementById('dm-none').classList.toggle('active',m==='none');
  renderDictate();
}
function renderDictate(){
  document.getElementById('dictate-content').innerHTML=chunks.map((c,i)=>`
    <div class="dc-card">
      <div class="dc-meta">#${String(i+1).padStart(2,'0')} · ${fmtT(c.t)}</div>
      ${dm==='cn'?`<div class="dc-prompt">${c.cn}</div>`:''}
      <button class="cbtn pink" style="margin-bottom:8px" onclick="dictPlay(${i})">▶ 播放</button>
      <div class="dc-row">
        <input class="dc-input" id="dci${i}" placeholder="输入你听到的英文…">
        <button class="cbtn pink" onclick="checkDi(${i})">检查</button>
      </div>
      <div class="dc-answer" id="dca${i}">${c.text}</div>
    </div>`).join('');
}
function dictPlay(i){
  if(!player)return;
  player.seekTo(chunks[i].t,true);
  player.playVideo();
  const dur=chunkDur(i);
  clearTimeout(window._dp);
  window._dp=setTimeout(()=>{if(player)player.pauseVideo();},dur*1000+300);
}
function checkDi(i){document.getElementById('dca'+i).classList.add('show');}

// ═══════════════ FILL ═══════════════
function setFM(m){
  fm=m;
  document.getElementById('fm-cn').classList.toggle('active',m==='cn');
  document.getElementById('fm-none').classList.toggle('active',m==='none');
  renderFill();
}
function fillHtml(text,ci){
  const ws=text.split(' ');
  const bi=new Set(pickBlanks(text));
  return ws.map((w,wi)=>{
    if(bi.has(wi)){
      const clean=w.replace(/[^a-zA-Z']/g,'');
      const trail=w.slice(clean.length);
      return `<span class="blank-wd" id="bw${ci}_${wi}" data-ans="${clean}">${'_'.repeat(Math.max(4,clean.length))}</span>${trail}`;
    }
    return w;
  }).join(' ');
}
function renderFill(){
  document.getElementById('fill-content').innerHTML=chunks.map((c,i)=>`
    <div class="dc-card">
      <div class="dc-meta">#${String(i+1).padStart(2,'0')} · ${fmtT(c.t)}</div>
      ${fm==='cn'?`<div class="dc-prompt">${c.cn}</div>`:''}
      <div style="font-size:14px;font-family:var(--mono);line-height:2;margin-bottom:8px">${fillHtml(c.text,i)}</div>
      <button class="cbtn pink" style="margin-bottom:8px" onclick="fillPlay(${i})">▶ 播放</button>
      <div class="dc-row">
        <input class="dc-input" id="fci${i}" placeholder="输入挖空的词（多个用逗号分隔）…">
        <button class="cbtn pink" onclick="checkFill(${i})">检查</button>
      </div>
      <div class="dc-answer" id="fca${i}">${c.text}</div>
    </div>`).join('');
}
function fillPlay(i){
  if(!player)return;
  player.seekTo(chunks[i].t,true);
  player.playVideo();
  clearTimeout(window._fp);
  window._fp=setTimeout(()=>{if(player)player.pauseVideo();},chunkDur(i)*1000+300);
}
function checkFill(i){
  document.getElementById('fca'+i).classList.add('show');
  const ws=chunks[i].text.split(' ');
  pickBlanks(chunks[i].text).forEach(wi=>{
    const el=document.getElementById(`bw${i}_${wi}`);
    if(el){el.textContent=ws[wi].replace(/[^a-zA-Z']/g,'');el.classList.add('rev');}
  });
}

// ═══════════════ NOTE ═══════════════
function renderNote(){
  document.getElementById('note-content').innerHTML=chunks.map((c,i)=>`
    <div class="note-card">
      <div class="dc-meta">#${String(i+1).padStart(2,'0')} · ${fmtT(c.t)}</div>
      <div style="font-size:14px;font-family:var(--mono);line-height:1.7;margin-bottom:3px">${c.text}</div>
      <div style="font-size:12px;color:var(--ink2);margin-bottom:6px">${c.cn}</div>
      <textarea class="note-input" id="ni${i}" placeholder="写下笔记、生词、造句…" onblur="saveNote(${i})">${notes[i]||''}</textarea>
      <div class="note-saved" id="ns${i}">已保存 ✓</div>
    </div>`).join('');
}
function saveNote(i){notes[i]=document.getElementById('ni'+i).value;const s=document.getElementById('ns'+i);s.style.display='block';setTimeout(()=>s.style.display='none',1500);}

// ═══════════════ INIT ═══════════════
renderSubList();
renderSingle();

// 页面加载后初始化本地播放器
window.addEventListener('load',initLocalPlayer);
</script>
