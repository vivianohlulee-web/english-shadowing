<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>情境跟读 · 移动端优先原型</title>
<style>
:root{--ink:#1d2838;--muted:#6d798a;--line:#dfe4ec;--soft:#f4f6fa;--violet:#6559e8;--violet2:#eceaff;--green:#21a884;--red:#f0546a;--yellow:#fff4bf;--shadow:0 14px 38px rgba(31,43,70,.09)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f6f7fb;color:var(--ink);font:15px/1.55 ui-sans-serif,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,select{font:inherit;color:inherit}button{cursor:pointer}.appbar{height:64px;padding:0 max(18px,calc((100vw - 1320px)/2));display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.92);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;backdrop-filter:blur(14px)}.brand{font-size:20px;font-weight:850}.brand span{color:var(--violet)}.toplinks{display:flex;gap:24px;color:var(--muted)}.shell{max-width:1320px;margin:auto;padding:22px;display:grid;grid-template-columns:minmax(0,1.65fr) minmax(320px,.8fr);gap:20px}.left,.right{min-width:0}.card{background:white;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}.player{aspect-ratio:16/9;min-height:280px;position:relative;overflow:hidden;background:radial-gradient(circle at 55% 38%,#8590f8 0,#4f48b6 28%,#242b4b 69%,#161b2f 100%)}.player:before,.player:after{content:"";position:absolute;border:1px solid rgba(255,255,255,.32);border-radius:50%;inset:16% 20%;transform:rotate(-12deg)}.player:after{inset:27% 32%;transform:rotate(18deg)}.orb{position:absolute;border-radius:50%;filter:blur(.1px);background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(158,225,255,.15));box-shadow:inset -12px -12px 28px rgba(90,65,205,.2)}.o1{width:120px;height:120px;left:12%;top:18%}.o2{width:75px;height:75px;right:16%;top:21%}.o3{width:150px;height:150px;right:8%;bottom:-45px}.playbig{position:absolute;left:50%;top:48%;translate:-50% -50%;width:72px;height:72px;border:0;border-radius:50%;background:rgba(255,255,255,.94);font-size:28px;padding-left:7px;box-shadow:0 12px 28px rgba(0,0,0,.24)}.video-copy{position:absolute;left:22px;bottom:43px;color:white}.video-copy strong{display:block;font-size:22px}.video-copy span{opacity:.75}.timeline{position:absolute;left:22px;right:22px;bottom:20px;height:5px;background:rgba(255,255,255,.28);border-radius:9px;overflow:hidden}.timeline i{display:block;height:100%;width:36%;background:white}.practice{padding:22px;margin-top:18px}.meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:13px}.english{font-size:clamp(26px,3vw,38px);line-height:1.25;margin:18px 0 7px;font-weight:830;letter-spacing:-.02em}.chinese{font-size:17px;color:var(--muted);margin:0}.timer-wrap{display:none;margin-top:18px;padding:14px;border-radius:15px;background:#fff3f5}.timer-wrap.show{display:block}.timer-line{height:9px;background:#f6c8cf;border-radius:8px;overflow:hidden;margin-top:9px}.timer-line i{display:block;height:100%;width:100%;background:var(--red);transform-origin:left}.timer-text{display:flex;justify-content:space-between;font-weight:750;color:#a72e40}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}.action{border:0;border-radius:16px;padding:14px 10px;font-weight:800;font-size:16px}.listen{background:#dff7ef;color:#08755d}.record{background:#ffe1e6;color:#b32039}.replay{background:#e7eaf0}.action:disabled{opacity:.48;cursor:not-allowed}.secondary-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}.secondary{border:1px solid var(--line);background:white;border-radius:12px;padding:8px 11px}.status{margin-top:13px;color:var(--violet);min-height:23px;font-weight:650}.controls{padding:20px;position:sticky;top:84px}.controls h2,.sentences h2{font-size:18px;margin:0 0 14px}.mode-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.mode-tabs button{border:1px solid var(--line);background:white;border-radius:13px;padding:10px 5px;font-size:13px}.mode-tabs button.active{background:var(--violet);border-color:var(--violet);color:#fff}.setting-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.field{font-size:12px;color:var(--muted)}select{display:block;width:100%;margin-top:5px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px}.session{margin-top:18px;border-top:1px solid var(--line);padding-top:18px}.session-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.primary{border:0;border-radius:14px;background:var(--red);color:white;font-weight:800;padding:12px}.ghost{border:1px solid var(--line);border-radius:14px;background:white;font-weight:750;padding:12px}.hint{font-size:12px;color:var(--muted);margin:10px 0 0}.sentences{padding:18px;margin-top:18px}.sentence-list{display:grid;gap:8px;max-height:390px;overflow:auto}.sentence-item{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;text-align:left;display:grid;grid-template-columns:34px 1fr auto;gap:9px;align-items:start}.sentence-item:hover{background:var(--soft)}.sentence-item.active{background:var(--yellow);border-color:#efc84a}.num{color:var(--muted);font-weight:800}.sentence-item strong{display:block}.sentence-item small{display:block;color:var(--muted);margin-top:2px}.duration{font-size:12px;color:var(--muted)}.mobile-settings{display:none}.drawer-mask{display:none}.toast{position:fixed;left:50%;bottom:22px;translate:-50% 30px;opacity:0;background:#20283b;color:#fff;border-radius:13px;padding:10px 16px;transition:.25s;z-index:60}.toast.show{translate:-50% 0;opacity:1}
@media(max-width:820px){body{background:#fff}.appbar{height:56px;padding:0 15px}.brand{font-size:18px}.toplinks{display:none}.shell{display:block;padding:0}.card{border-radius:0;border-left:0;border-right:0;box-shadow:none}.player{min-height:0;border:0}.right{display:none}.practice{margin-top:0;border-top:0;padding:17px 15px 112px}.meta{font-size:12px}.english{font-size:25px;margin-top:14px}.chinese{font-size:15px}.actions{position:fixed;z-index:30;left:0;right:0;bottom:0;margin:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));backdrop-filter:blur(14px)}.action{padding:13px 5px}.secondary-row{display:grid;grid-template-columns:1fr 1fr}.mobile-settings{display:block;border:1px solid var(--line);background:white;border-radius:12px;padding:8px 11px}.sentence-list{max-height:none}.mobile-list{padding:0 15px 30px}.mobile-list .sentences{border:0;padding:0}.drawer-mask{display:none;position:fixed;inset:0;background:rgba(20,26,42,.42);z-index:39}.drawer-mask.show{display:block}.drawer{position:absolute;bottom:0;left:0;right:0;background:#fff;border-radius:22px 22px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom))}.drawer .controls{position:static;padding:0;border:0;box-shadow:none}.drawer-close{float:right;border:0;background:var(--soft);border-radius:50%;width:34px;height:34px}.player .video-copy strong{font-size:17px}.player .video-copy span{font-size:12px}.playbig{width:58px;height:58px;font-size:23px}.timer-wrap{margin-top:14px}}
@media(min-width:821px){.mobile-list{display:none}}
</style>
</head>
<body>
<header class="appbar"><div class="brand"><span>Echo</span> English · 情境跟读</div><nav class="toplinks"><span>练习记录</span><span>表达收藏</span><span>设置</span></nav></header>
<main class="shell">
<section class="left">
  <div class="player card" id="player"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i><button class="playbig" id="heroPlay" aria-label="播放当前句">▶</button><div class="video-copy"><strong>Friends · Everyday English</strong><span>演示版使用浏览器英文朗读</span></div><div class="timeline"><i></i></div></div>
  <article class="practice card">
    <div class="meta"><span id="counter">第 1 / 8 句</span><span id="timecode">00:00–00:04</span></div>
    <h1 class="english" id="english"></h1><p class="chinese" id="chinese"></p>
    <div class="timer-wrap" id="timerWrap"><div class="timer-text"><span id="timerLabel">准备录音</span><span id="timerValue">9.0s</span></div><div class="timer-line"><i id="timerBar"></i></div></div>
    <div class="actions"><button class="action listen" id="playBtn">▶ 播放</button><button class="action record" id="recordBtn">● 录音</button><button class="action replay" id="replayBtn" disabled>↻ 回放</button></div>
    <div class="secondary-row"><button class="secondary" id="prevBtn">← 上一句</button><button class="secondary" id="nextBtn">下一句 →</button><button class="mobile-settings" id="openSettings">⚙ 练习设置</button><button class="secondary" id="favBtn">☆ 收藏表达</button></div>
    <div class="status" id="status" role="status">请选择一句开始练习</div>
  </article>
  <div class="mobile-list"><section class="sentences card"><h2>全部句段</h2><div class="sentence-list" id="mobileSentenceList"></div></section></div>
</section>
<aside class="right">
  <section class="controls card" id="desktopControls"></section>
  <section class="sentences card"><h2>全部句段</h2><div class="sentence-list" id="desktopSentenceList"></div></section>
</aside>
</main>
<div class="drawer-mask" id="drawerMask"><div class="drawer"><button class="drawer-close" id="closeSettings">×</button><div id="mobileControls"></div></div></div>
<div class="toast" id="toast">已收藏</div>
<template id="controlsTemplate"><div class="controls-inner"><h2>练习控制</h2><div class="mode-tabs"><button data-mode="normal">普通跟读</button><button data-mode="timed">限时单句</button><button data-mode="continuous">限时连续</button></div><div class="setting-grid"><label class="field">字幕<select data-setting="subtitle"><option value="bi">中英双语</option><option value="en">仅英文</option><option value="cn">仅中文</option><option value="off">隐藏字幕</option></select></label><label class="field">播放速度<select data-setting="rate"><option value="0.7">0.7×</option><option value="0.8">0.8×</option><option value="1" selected>1.0×</option><option value="1.2">1.2×</option></select></label><label class="field">播放方式<select data-setting="repeat"><option value="1">单次播放</option><option value="3">循环 3 次</option><option value="5">循环 5 次</option><option value="0">持续循环</option></select></label><label class="field">录音余量<select data-setting="extra"><option value="3">原句 + 3 秒</option><option value="5" selected>原句 + 5 秒</option><option value="8">原句 + 8 秒</option></select></label></div><div class="session"><div class="session-buttons"><button class="primary" data-action="session">● 开始连续练习</button><button class="ghost" data-action="sessionReplay" disabled>↻ 本轮回放</button></div><p class="hint">连续模式会自动完成“播放 → 提示音 → 倒计时录音 → 下一句”。开始新一轮会清空上一轮录音。</p></div></div></template>
<script>
const chunks=[
{text:"I’ve been meaning to tell you something.",cn:"我一直想告诉你一件事。",dur:4.2},
{text:"What are you talking about?",cn:"你在说什么？",dur:2.7},
{text:"Let me explain what happened.",cn:"让我解释一下发生了什么。",dur:3.1},
{text:"I didn’t expect things to turn out this way.",cn:"我没想到事情会变成这样。",dur:4.5},
{text:"It took me a while to figure it out.",cn:"我花了一些时间才弄明白。",dur:4.0},
{text:"That’s exactly what I was trying to say.",cn:"那正是我想表达的。",dur:3.8},
{text:"Do you want to give it another try?",cn:"你想再试一次吗？",dur:3.6},
{text:"I feel much more confident now.",cn:"我现在自信多了。",dur:3.2}
];
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let state={index:0,mode:'normal',subtitle:'bi',rate:1,repeat:1,extra:5,favorites:new Set()};
let mediaRecorder=null,recorded=[],recordingUrl='',sessionUrls=[],timerRAF=0,runToken=0,isRecording=false;
function fmt(v){return '00:'+String(Math.round(v)).padStart(2,'0')}
function cloneControls(target){target.append($('#controlsTemplate').content.cloneNode(true))}
cloneControls($('#desktopControls'));cloneControls($('#mobileControls'));
function syncControls(){
  $$('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===state.mode));
  $$('[data-setting]').forEach(el=>el.value=String(state[el.dataset.setting]));
  $$('[data-action="session"]').forEach(b=>{b.disabled=state.mode!=='continuous';b.textContent=state.mode==='continuous'?'● 开始连续练习':'连续模式可用'});
  $$('[data-action="sessionReplay"]').forEach(b=>b.disabled=!sessionUrls.length);
}
function render(){const c=chunks[state.index];$('#english').textContent=c.text;$('#chinese').textContent=c.cn;$('#counter').textContent=`第 ${state.index+1} / ${chunks.length} 句`;let start=chunks.slice(0,state.index).reduce((a,x)=>a+x.dur,0);$('#timecode').textContent=`${fmt(start)}–${fmt(start+c.dur)}`;$('#english').hidden=!['bi','en'].includes(state.subtitle);$('#chinese').hidden=!['bi','cn'].includes(state.subtitle);$('#prevBtn').disabled=state.index===0;$('#nextBtn').disabled=state.index===chunks.length-1;$('#favBtn').textContent=state.favorites.has(state.index)?'★ 已收藏':'☆ 收藏表达';renderLists();syncControls()}
function renderLists(){const html=chunks.map((c,i)=>`<button class="sentence-item ${i===state.index?'active':''}" data-index="${i}"><span class="num">${String(i+1).padStart(2,'0')}</span><span><strong>${c.text}</strong><small>${c.cn}</small></span><span class="duration">${c.dur.toFixed(1)}s</span></button>`).join('');$('#desktopSentenceList').innerHTML=html;$('#mobileSentenceList').innerHTML=html}
function status(s){$('#status').textContent=s}
function stopAll(){runToken++;speechSynthesis.cancel();cancelAnimationFrame(timerRAF);$('#timerWrap').classList.remove('show')}
function beep(){return new Promise(resolve=>{try{const ac=new (window.AudioContext||window.webkitAudioContext)(),o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.18);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.18);setTimeout(()=>{ac.close();resolve()},240)}catch(e){resolve()}})}
function speakOnce(index,token){return new Promise(resolve=>{if(token!==runToken)return resolve();const u=new SpeechSynthesisUtterance(chunks[index].text);u.lang='en-US';u.rate=state.rate;u.onend=resolve;u.onerror=resolve;speechSynthesis.speak(u)})}
async function playSentence(index=state.index,forTimed=false){const token=++runToken;speechSynthesis.cancel();let n=0,max=state.repeat===0?999:state.repeat;status(`正在播放 · ${state.rate}×`);while(token===runToken&&n<max){await speakOnce(index,token);n++;if(token!==runToken)break;if(n<max)await new Promise(r=>setTimeout(r,450));}if(token!==runToken)return;if(forTimed||state.mode!=='normal')await timedRecord(index,token);else status('播放完成，可以开始录音')}
async function setupRecorder(){if(mediaRecorder)return true;if(!navigator.mediaDevices?.getUserMedia){status('当前浏览器不支持录音');return false}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});mediaRecorder=new MediaRecorder(stream);mediaRecorder.ondataavailable=e=>{if(e.data.size)recorded.push(e.data)};mediaRecorder.onstop=()=>{const blob=new Blob(recorded,{type:mediaRecorder.mimeType||'audio/webm'});recorded=[];if(recordingUrl)URL.revokeObjectURL(recordingUrl);recordingUrl=URL.createObjectURL(blob);$('#replayBtn').disabled=false;if(state.mode==='continuous'){sessionUrls.push(recordingUrl);syncControls()}status('录音已完成，可以回放')};return true}catch(e){status('需要允许麦克风权限才能录音');return false}}
async function startRecording(auto=false){if(isRecording)return;const ok=await setupRecorder();if(!ok)return;recorded=[];mediaRecorder.start();isRecording=true;$('#recordBtn').textContent='■ 停止';status(auto?'限时录音中…':'正在录音…')}
function stopRecording(){if(mediaRecorder&&mediaRecorder.state==='recording')mediaRecorder.stop();isRecording=false;$('#recordBtn').textContent='● 录音'}
async function timedRecord(index,token){await beep();if(token!==runToken)return;const total=chunks[index].dur+Number(state.extra);const ok=await setupRecorder();if(!ok)return;await startRecording(true);$('#timerWrap').classList.add('show');const start=performance.now();return new Promise(resolve=>{function frame(now){if(token!==runToken){stopRecording();return resolve()}const left=Math.max(0,total-(now-start)/1000);$('#timerValue').textContent=left.toFixed(1)+'s';$('#timerLabel').textContent='请跟读';$('#timerBar').style.transform=`scaleX(${left/total})`;if(left<=0){stopRecording();$('#timerWrap').classList.remove('show');return resolve()}timerRAF=requestAnimationFrame(frame)}timerRAF=requestAnimationFrame(frame)})}
async function startContinuous(){stopAll();sessionUrls=[];recordingUrl='';$('#replayBtn').disabled=true;syncControls();const token=runToken;status('连续练习开始');for(let i=state.index;i<chunks.length&&token===runToken;i++){state.index=i;render();await speakOnce(i,token);if(token!==runToken)break;await timedRecord(i,token);await new Promise(r=>setTimeout(r,500))}if(token===runToken)status(`本轮完成，共练习 ${sessionUrls.length} 句`)}
async function replaySession(){for(const url of sessionUrls){await new Promise(resolve=>{const a=new Audio(url);a.onended=resolve;a.onerror=resolve;a.play()})}}
$$('[data-mode]').forEach(b=>b.onclick=()=>{stopAll();state.mode=b.dataset.mode;status(state.mode==='normal'?'普通跟读：播放与录音由你控制':state.mode==='timed'?'限时单句：播放后自动提示并录音':'限时连续：从当前句自动练到最后');syncControls()});
$$('[data-setting]').forEach(el=>el.onchange=()=>{state[el.dataset.setting]=el.dataset.setting==='subtitle'?el.value:Number(el.value);render()});
document.addEventListener('click',e=>{const item=e.target.closest('[data-index]');if(item){stopAll();state.index=Number(item.dataset.index);render();scrollTo({top:0,behavior:'smooth'})}const act=e.target.closest('[data-action]');if(act?.dataset.action==='session')startContinuous();if(act?.dataset.action==='sessionReplay')replaySession()});
$('#playBtn').onclick=$('#heroPlay').onclick=()=>playSentence(state.index,state.mode!=='normal');$('#recordBtn').onclick=()=>isRecording?stopRecording():startRecording();$('#replayBtn').onclick=()=>recordingUrl&&new Audio(recordingUrl).play();$('#prevBtn').onclick=()=>{if(state.index){stopAll();state.index--;render()}};$('#nextBtn').onclick=()=>{if(state.index<chunks.length-1){stopAll();state.index++;render()}};$('#favBtn').onclick=()=>{state.favorites.has(state.index)?state.favorites.delete(state.index):state.favorites.add(state.index);render();const t=$('#toast');t.textContent=state.favorites.has(state.index)?'已收藏表达':'已取消收藏';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1200)};
$('#openSettings').onclick=()=>$('#drawerMask').classList.add('show');$('#closeSettings').onclick=()=>$('#drawerMask').classList.remove('show');$('#drawerMask').onclick=e=>{if(e.target===$('#drawerMask'))$('#drawerMask').classList.remove('show')};
render();
</script>
</body>
</html>
