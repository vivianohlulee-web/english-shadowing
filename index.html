<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日英语跟读</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1a1a1a;--ink2:#555;--ink3:#999;
  --paper:#faf9f6;--paper2:#f0ede6;--paper3:#e8e3d8;
  --gold:#c8952a;--gold-l:#fdf3dc;--gold-d:#9a6f1a;
  --teal:#1a7a6e;--teal-l:#e8f5f3;--teal-d:#115a50;
  --red:#c0392b;--red-l:#fdecea;
  --border:#ddd8ce;--border2:#ccc5b8;
  --r:8px;--rs:5px;
  --font-body:'Noto Serif SC',serif;
  --font-mono:'DM Mono',monospace;
  --shadow:0 2px 12px rgba(0,0,0,.08);
}
html,body{height:100%;background:var(--paper);color:var(--ink);font-family:var(--font-body)}

/* ── HEADER ── */
.header{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--paper)}
.logo{font-size:15px;font-weight:600;color:var(--teal);letter-spacing:.02em}
.vtitle{font-size:13px;color:var(--ink2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vmeta{font-size:11px;color:var(--ink3);white-space:nowrap}

/* ── LAYOUT ── */
.layout{display:grid;grid-template-columns:1fr 1fr;height:calc(100vh - 49px);overflow:hidden}
.left-panel{display:flex;flex-direction:column;border-right:1px solid var(--border);overflow:hidden}
.right-panel{display:flex;flex-direction:column;overflow:hidden}

/* ── VIDEO ── */
.video-wrap{position:relative;padding-bottom:56.25%;background:#111;flex-shrink:0}
.video-wrap iframe,.video-wrap #yt-player{position:absolute;top:0;left:0;width:100%;height:100%}

/* ── VIDEO CONTROLS ── */
.vid-controls{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--paper2);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.vc-btn{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:var(--rs);border:1px solid var(--border2);background:var(--paper);color:var(--ink);font-size:12px;font-family:var(--font-body);cursor:pointer;transition:all .15s;white-space:nowrap}
.vc-btn:hover{background:var(--paper3)}
.vc-btn.active{background:var(--gold);border-color:var(--gold-d);color:#fff}
.vc-btn.play-btn{background:var(--teal);border-color:var(--teal-d);color:#fff;font-size:14px;padding:5px 12px}
.vc-btn.play-btn:hover{background:var(--teal-d)}
.vc-sep{flex:1}

/* ── SUBTITLE DISPLAY ── */
.sub-lang-bar{display:flex;align-items:center;gap:6px;padding:8px 14px;background:var(--paper);border-bottom:1px solid var(--border);flex-shrink:0}
.sub-lang-label{font-size:11px;color:var(--ink3)}
.sub-lang-btn{padding:3px 10px;border-radius:99px;border:1px solid var(--border2);background:var(--paper2);color:var(--ink2);font-size:11px;cursor:pointer;transition:all .15s}
.sub-lang-btn.active{background:var(--teal);border-color:var(--teal-d);color:#fff}

/* ── MODE TABS ── */
.mode-tabs{display:flex;gap:4px;padding:8px 14px;background:var(--paper2);border-bottom:1px solid var(--border);flex-shrink:0}
.tab{padding:5px 14px;border-radius:var(--rs);border:1px solid var(--border2);background:var(--paper);color:var(--ink2);font-size:12px;font-family:var(--font-body);cursor:pointer;transition:all .15s}
.tab:hover{background:var(--paper3)}
.tab.active{background:var(--gold);border-color:var(--gold-d);color:#fff;font-weight:600}

/* ── SUBTITLE SCROLL AREA ── */
.sub-area{flex:1;overflow-y:auto;padding:0}
.sub-chunk{padding:14px 18px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;position:relative}
.sub-chunk:hover{background:var(--paper2)}
.sub-chunk.active{background:var(--gold-l);border-left:3px solid var(--gold)}
.sub-chunk.done{opacity:.45}
.chunk-num{font-size:10px;color:var(--ink3);font-family:var(--font-mono);margin-bottom:5px}
.chunk-en{font-size:14px;line-height:1.7;color:var(--ink);font-family:var(--font-mono)}
.chunk-cn{font-size:12px;color:var(--ink2);margin-top:3px;line-height:1.5}
.sub-chunk.active .chunk-en{color:var(--gold-d);font-weight:500}

/* word highlight */
.word{display:inline;transition:background .1s}
.word.lit{background:var(--gold);color:#fff;border-radius:2px;padding:0 2px}

/* ── MODE PANELS ── */
.mode-panel{flex:1;overflow-y:auto;padding:14px 18px;display:none}
.mode-panel.show{display:block}

/* 跟读子模式 */
.sub-mode-row{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.sm-btn{padding:5px 14px;border-radius:99px;border:1px solid var(--border2);background:var(--paper2);color:var(--ink2);font-size:12px;cursor:pointer;transition:all .15s}
.sm-btn.active{background:var(--teal);border-color:var(--teal-d);color:#fff}

/* 单句跟读卡片 */
.shadowing-card{background:var(--paper);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:10px}
.sc-en{font-size:15px;font-family:var(--font-mono);line-height:1.7;margin-bottom:6px}
.sc-cn{font-size:12px;color:var(--ink2);margin-bottom:12px}
.sc-controls{display:flex;gap:6px;flex-wrap:wrap}
.sc-btn{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:var(--rs);border:1px solid var(--border2);background:var(--paper2);color:var(--ink);font-size:12px;cursor:pointer;transition:all .15s}
.sc-btn:hover{background:var(--paper3)}
.sc-btn.primary{background:var(--teal);border-color:var(--teal-d);color:#fff}
.sc-btn.danger{background:var(--red);border-color:#a93226;color:#fff}
.rec-status{font-size:11px;color:var(--ink3);align-self:center;margin-left:4px}

/* 连续/限时跟读 */
.continuous-card{background:var(--paper);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.cc-nav{display:flex;align-items:center;gap:10px;margin-top:12px}
.cc-info{font-size:12px;color:var(--ink3);flex:1;text-align:center}
.countdown-bar{height:4px;background:var(--border);border-radius:99px;margin-top:10px;overflow:hidden;display:none}
.countdown-fill{height:100%;background:var(--gold);border-radius:99px;transition:width .1s linear}
.countdown-bar.show{display:block}

/* 听写/挖空 输入 */
.dictation-card{background:var(--paper);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:10px}
.dc-prompt{font-size:13px;color:var(--ink2);margin-bottom:8px;line-height:1.6}
.dc-input-row{display:flex;gap:6px;align-items:center}
.dc-input{flex:1;padding:7px 10px;border:1px solid var(--border2);border-radius:var(--rs);background:var(--paper2);font-size:13px;font-family:var(--font-mono);color:var(--ink);outline:none}
.dc-input:focus{border-color:var(--teal);background:#fff}
.dc-answer{font-size:13px;font-family:var(--font-mono);color:var(--teal);margin-top:6px;display:none;line-height:1.6}
.dc-answer.show{display:block}
.blank{display:inline-block;min-width:60px;border-bottom:2px solid var(--gold);color:transparent;background:var(--gold-l);border-radius:2px;font-family:var(--font-mono)}
.blank.revealed{color:var(--gold-d);background:var(--gold-l)}

/* 笔记 */
.note-card{background:var(--paper);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:10px}
.note-en{font-size:14px;font-family:var(--font-mono);line-height:1.7;margin-bottom:4px}
.note-cn{font-size:12px;color:var(--ink2);margin-bottom:8px}
.note-input{width:100%;padding:7px 10px;border:1px solid var(--border2);border-radius:var(--rs);background:var(--paper2);font-size:13px;font-family:var(--font-body);color:var(--ink);outline:none;resize:vertical;min-height:60px}
.note-input:focus{border-color:var(--teal);background:#fff}
.note-saved{font-size:11px;color:var(--teal);margin-top:4px;display:none}

/* progress */
.prog-bar{height:3px;background:var(--border);position:relative;flex-shrink:0}
.prog-fill2{height:100%;background:var(--gold);transition:width .3s}

/* ── BLIND overlay ── */
.blind-overlay{display:none;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;gap:12px;flex:1}
.blind-overlay.show{display:flex}
.blind-icon{font-size:36px}
.blind-t{font-size:15px;font-weight:600;color:var(--ink)}
.blind-s{font-size:13px;color:var(--ink2);line-height:1.7}
.blind-cur{background:var(--paper2);border:1px solid var(--border);border-radius:var(--r);padding:12px 18px;margin-top:4px;font-size:14px;font-family:var(--font-mono);color:var(--teal-d);display:none}
.blind-cur.show{display:block}
.blind-cur-cn{font-size:12px;color:var(--ink2);margin-top:4px}
.autopause-row{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--paper2);border:1px solid var(--border);border-radius:var(--rs);margin-top:8px;font-size:13px;color:var(--ink2)}
.toggle{position:relative;width:34px;height:18px;margin-left:auto}
.toggle input{opacity:0;width:0;height:0}
.tsl{position:absolute;inset:0;background:var(--border2);border-radius:99px;cursor:pointer;transition:.2s}
.tsl:before{content:'';position:absolute;width:14px;height:14px;left:2px;bottom:2px;background:#fff;border-radius:50%;transition:.2s}
.toggle input:checked+.tsl{background:var(--teal)}
.toggle input:checked+.tsl:before{transform:translateX(16px)}

/* ── MOBILE ── */
@media(max-width:768px){
  .layout{grid-template-columns:1fr;height:auto;overflow:visible}
  .left-panel{border-right:none;border-bottom:1px solid var(--border)}
  .right-panel{min-height:60vh}
  .sub-area{max-height:40vh}
  .mode-panel{min-height:40vh}
}

/* scrollbar */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}
</style>
</head>
<body>

<div class="header">
  <div class="logo">每日英语</div>
  <div class="vtitle">For those feeling behind in life — Life Of Riza</div>
  <div class="vmeta">84句</div>
</div>

<div class="layout">
  <!-- LEFT: video + subtitle list -->
  <div class="left-panel">
    <div class="video-wrap"><div id="yt-player"></div></div>
    <div class="prog-bar"><div class="prog-fill2" id="prog" style="width:0%"></div></div>

    <!-- video controls -->
    <div class="vid-controls">
      <button class="vc-btn" id="btn-sub" onclick="toggleSubLang()">字幕</button>
      <button class="vc-btn" onclick="go(-1)">上一句</button>
      <button class="vc-btn play-btn" id="btn-play" onclick="togglePlay()">▶</button>
      <button class="vc-btn" onclick="go(1)">下一句</button>
      <button class="vc-btn" id="btn-blind" onclick="toggleBlind()">盲听</button>
    </div>

    <!-- subtitle lang bar -->
    <div class="sub-lang-bar" id="sub-lang-bar">
      <span class="sub-lang-label">字幕：</span>
      <button class="sub-lang-btn active" id="slb-en" onclick="setSubLang('en')">英文</button>
      <button class="sub-lang-btn" id="slb-bi" onclick="setSubLang('bi')">双语</button>
    </div>

    <!-- subtitle scroll -->
    <div class="sub-area" id="sub-area"></div>

    <!-- blind overlay (inside left panel, over subtitle area) -->
    <div class="blind-overlay" id="blind-overlay">
      <div class="blind-icon">👂</div>
      <div class="blind-t">盲听模式</div>
      <div class="blind-s">字幕已隐藏<br>专注用耳朵听</div>
      <div class="blind-cur" id="blind-cur">
        <div id="blind-cur-text">—</div>
        <div class="blind-cur-cn" id="blind-cur-cn">—</div>
      </div>
      <div class="autopause-row">
        单句播放完自动暂停
        <label class="toggle"><input type="checkbox" id="ap-tog" onchange="autoPause=this.checked"><span class="tsl"></span></label>
      </div>
      <div style="display:flex;gap:8px;margin-top:4px">
        <button class="vc-btn play-btn" onclick="blindRestart()">▶ 从头播放</button>
        <button class="vc-btn" onclick="toggleBlind()">☰ 退出盲听</button>
      </div>
    </div>
  </div>

  <!-- RIGHT: mode tabs + mode panels -->
  <div class="right-panel">
    <div class="mode-tabs">
      <button class="tab active" id="tab-shadow" onclick="setModeTab('shadow')">跟读</button>
      <button class="tab" id="tab-dictate" onclick="setModeTab('dictate')">听写</button>
      <button class="tab" id="tab-fill" onclick="setModeTab('fill')">挖空</button>
      <button class="tab" id="tab-note" onclick="setModeTab('note')">笔记</button>
    </div>

    <!-- 跟读 panel -->
    <div class="mode-panel show" id="panel-shadow">
      <div class="sub-mode-row">
        <button class="sm-btn active" id="sm-single" onclick="setShadowMode('single')">单句跟读</button>
        <button class="sm-btn" id="sm-cont" onclick="setShadowMode('cont')">连续跟读</button>
        <button class="sm-btn" id="sm-timed" onclick="setShadowMode('timed')">限时跟读</button>
      </div>
      <div id="shadow-content"></div>
    </div>

    <!-- 听写 panel -->
    <div class="mode-panel" id="panel-dictate">
      <div class="sub-mode-row">
        <button class="sm-btn active" id="dm-cn" onclick="setDictateMode('cn')">显示中文</button>
        <button class="sm-btn" id="dm-none" onclick="setDictateMode('none')">无字幕</button>
      </div>
      <div id="dictate-content"></div>
    </div>

    <!-- 挖空 panel -->
    <div class="mode-panel" id="panel-fill">
      <div class="sub-mode-row">
        <button class="sm-btn active" id="fm-cn" onclick="setFillMode('cn')">显示中文</button>
        <button class="sm-btn" id="fm-none" onclick="setFillMode('none')">不显示中文</button>
      </div>
      <div id="fill-content"></div>
    </div>

    <!-- 笔记 panel -->
    <div class="mode-panel" id="panel-note">
      <div id="note-content"></div>
    </div>
  </div>
</div>

<script>
// ── DATA ──
const chunks=[
  {text:"Somewhere between childhood and now,",cn:"在童年与现在之间的某个时刻，",t:5},
  {text:"we learned how to measure our lives and milestones.",cn:"我们学会了用里程碑来衡量自己的人生。",t:7},
  {text:"First day of school, last day of school,",cn:"开学第一天、毕业最后一天、",t:10},
  {text:"first job, first promotion,",cn:"第一份工作、第一次晋升、",t:12},
  {text:"marriage, house, kids — you know the list.",cn:"结婚、买房、生孩子——你懂的。",t:14},
  {text:"And it can feel really overwhelming",cn:"而当我们没有按时完成这些事时，",t:21},
  {text:"when we're not ticking those boxes when we're supposed to.",cn:"会感到非常沮丧和压迫感。",t:22},
  {text:"It can feel like everyone is moving forward",cn:"感觉好像每个人都在向前走，",t:25},
  {text:"and we're just falling behind.",cn:"而我们却在落后。",t:28},
  {text:"Recently, I've been thinking a lot",cn:"最近，我一直在大量思考",t:60},
  {text:"about how we define success,",cn:"关于我们如何定义成功，",t:62},
  {text:"and what that looks like now",cn:"以及现在的成功是什么样的，",t:65},
  {text:"versus what I thought it would look like a couple years ago.",cn:"与几年前我所认为的相比。",t:67},
  {text:"And it made me realize",cn:"这让我意识到，",t:69},
  {text:"that this is something I should probably revisit every so often,",cn:"我应该时不时地重新审视这个问题，",t:71},
  {text:"because as life changes,",cn:"因为随着生活的变化，",t:73},
  {text:"the way we measure it sort of has to change too.",cn:"我们衡量它的方式也必须随之改变。",t:76},
  {text:"Love this train of thought —",cn:"这个思路让我很有感触——",t:125},
  {text:"it first happened when I was thinking",cn:"最初是在我思考",t:127},
  {text:"of ways I had measured progress throughout my life.",cn:"我一生中如何衡量进步时产生的。",t:129},
  {text:"When I was a kid, I did sports.",cn:"我小时候做运动。",t:132},
  {text:"I would measure it by medals",cn:"我用奖牌来衡量，",t:134},
  {text:"or moving up in lessons.",cn:"或者升到更高的级别。",t:136},
  {text:"But after graduating,",cn:"但毕业之后，",t:138},
  {text:"I stepped away from competing,",cn:"我退出了比赛，",t:140},
  {text:"and I was at a sudden loss",cn:"突然间我完全不明白",t:141},
  {text:"as to why I felt the way that I did.",cn:"为什么自己会有那样的感觉。",t:143},
  {text:"And at the time, I didn't realize",cn:"当时我并没有意识到，",t:145},
  {text:"that I had lost the main indicator",cn:"我已经失去了主要的参照物，",t:147},
  {text:"of my measure of progress and subsequently success.",cn:"失去了衡量进步乃至成功的标准。",t:150},
  {text:"It got me thinking —",cn:"这让我想到——",t:155},
  {text:"maybe all of us have these markers",cn:"也许我们每个人都有这些参照物，",t:157},
  {text:"we lean on without even noticing,",cn:"我们在不知不觉中依赖着它们，",t:159},
  {text:"and when they disappear,",cn:"而当它们消失时，",t:162},
  {text:"it can feel like the ground has shifted beneath us.",cn:"会感觉脚下的土地发生了移动。",t:163},
  {text:"But realizing this allowed me to look at things differently",cn:"但意识到这一点后，我得以用不同的视角看待事物，",t:168},
  {text:"and reevaluate what progress and success look like",cn:"并重新评估进步和成功",t:171},
  {text:"now in relevance to my life.",cn:"在我现在生活中意味着什么。",t:173},
  {text:"Currently, if you keep measuring your current life",cn:"如果你继续用旧定义衡量现在的生活，",t:176},
  {text:"with a definition you picked up at 16 or 21,",cn:"那个你在16岁或21岁时形成的定义，",t:180},
  {text:"it's going to feel like you're falling behind",cn:"你会感觉自己在落后，",t:182},
  {text:"even when you're not.",cn:"即使你并没有。",t:185},
  {text:"So when things start to feel off,",cn:"所以当事情开始感觉不对劲时，",t:189},
  {text:"it's easy to assume something's wrong",cn:"很容易就认定出了问题，",t:191},
  {text:"without realizing the definition you're using",cn:"却没意识到你使用的定义",t:193},
  {text:"might just be outdated.",cn:"可能只是过时了。",t:195},
  {text:"Oftentimes, we feel behind",cn:"很多时候，我们感到落后，",t:211},
  {text:"because we're not where we think we should be at this point in time,",cn:"是因为我们没有达到我们认为应该达到的水平，",t:212},
  {text:"but what we don't see is that",cn:"但我们没看到的是，",t:215},
  {text:"where we're at now is preparing us for what's ahead.",cn:"我们现在所处的位置正在为未来做准备。",t:218},
  {text:"Making your own way in the world is exciting.",cn:"在世界上走出自己的道路是令人兴奋的。",t:222},
  {text:"You know what you want and you're going for it.",cn:"你知道自己想要什么，并且正在努力争取。",t:225},
  {text:"But when everyone around you seems to be following a clear-cut path,",cn:"但当周围的人都在遵循清晰的道路时，",t:228},
  {text:"it's really hard not to wonder",cn:"你很难不去怀疑，",t:229},
  {text:"if you are the one doing something wrong.",cn:"是不是自己做错了什么。",t:232},
  {text:"I remember in the early years of pursuing YouTube,",cn:"我记得在刚开始做YouTube的时候，",t:240},
  {text:"I was always wondering why it just wasn't happening for me yet.",cn:"我总是纳闷为什么我还没成功。",t:244},
  {text:"It was frustrating.",cn:"真令人沮丧。",t:248},
  {text:"And to add to my already growing doubt,",cn:"更加剧了我日益增长的疑虑的是，",t:248},
  {text:"I had friends that were already moving on",cn:"我的一些朋友已经开始了",t:251},
  {text:"with the next chapter of their life.",cn:"人生的新篇章。",t:254},
  {text:"It felt like everyone knew their path,",cn:"感觉每个人都知道自己的路，",t:256},
  {text:"and I was still trying to find my way,",cn:"而我还在摸索自己的方向，",t:257},
  {text:"but there was something in me that wanted to stay the course.",cn:"但我内心深处却想坚持下去。",t:260},
  {text:"And so I pursued the path.",cn:"于是我便踏上了这条道路。",t:263},
  {text:"And looking back now,",cn:"现在回想起来，",t:267},
  {text:"everything I learned along the way was so necessary",cn:"我一路走来学到的一切都非常必要，",t:270},
  {text:"and contributed in some form to what I do today,",cn:"并以某种形式对今天的我做出了贡献，",t:271},
  {text:"even if it felt like a detour at the time.",cn:"即使当时感觉像是走了一条弯路。",t:275},
  {text:"The more I think about it,",cn:"我越想越觉得，",t:288},
  {text:"the more I think that 8 billion people",cn:"80亿人",t:290},
  {text:"can't be on the same path, right?",cn:"不可能走同一条路，对吧？",t:292},
  {text:"Like how would that work?",cn:"那具体该怎么操作呢？",t:294},
  {text:"We're all different.",cn:"我们每个人都不一样。",t:296},
  {text:"We can't all like the same things",cn:"我们不可能都喜欢同样的东西，",t:296},
  {text:"or hit the same milestones at the same time.",cn:"也不可能同时达到同样的里程碑。",t:298},
  {text:"Some get married young, some never want to at all.",cn:"有些人早早结婚，有些人则根本不想结婚。",t:301},
  {text:"Others become nomads and call the road home.",cn:"另一些人则成为游牧民族，把道路当作自己的家。",t:304},
  {text:"Some are happy building a quiet life.",cn:"有些人乐于过平静的生活。",t:306},
  {text:"You're allowed to choose your own adventure,",cn:"你可以选择自己的冒险之路，",t:308},
  {text:"not just once, but over and over again.",cn:"而且不止一次，可以一次又一次。",t:311},
  {text:"I find that we often feel behind",cn:"我发现我们常常感到落后，",t:346},
  {text:"because we have this idea of how something should have been,",cn:"是因为我们对某件事应该如何发展抱有某种想法，",t:348},
  {text:"but seldom does it happen like that.",cn:"但事情很少会按照我们预想的那样发展。",t:353},
  {text:"And I think that's where a lot of the doubt comes from —",cn:"我认为很多疑虑都源于此——",t:357},
  {text:"not knowing whether we're stuck",cn:"不知道自己是陷入了困境，",t:360},
  {text:"or just standing at the edge of a new idea",cn:"还是正站在一个新认知的边缘，",t:362},
  {text:"of what success looks like.",cn:"关于成功是什么样的。",t:364},
];

// complex words to blank out
const complexWords=['measure','milestones','overwhelming','promotion','pursuing','subsequently','indicator','reevaluate','definition','outdated','preparing','competing','adventure','frustrated','nomads','concrete'];

// ── STATE ──
let cur=0, player=null, isBlind=false, autoPause=false;
let subLang='en'; // 'en' | 'bi' | 'hide'
let modeTab='shadow'; // shadow|dictate|fill|note
let shadowMode='single'; // single|cont|timed
let dictateMode='cn'; // cn|none
let fillMode='cn'; // cn|none
let syncTimer=null;
let timedTimer=null, timedActive=false;
let notes={};
let playing=false;
let recState={}; // {idx: 'idle'|'recording'}

// ── YOUTUBE API ──
window.onYouTubeIframeAPIReady=function(){
  player=new YT.Player('yt-player',{
    videoId:'4M6Ykqw26TI',
    playerVars:{rel:0,modestbranding:1},
    events:{onStateChange:onPSC}
  });
};
function onPSC(e){
  playing=(e.data===YT.PlayerState.PLAYING);
  document.getElementById('btn-play').textContent=playing?'⏸':'▶';
  if(playing) startSync(); else stopSync();
}
function startSync(){
  stopSync();
  syncTimer=setInterval(()=>{
    if(!player) return;
    const t=player.getCurrentTime();
    const idx=getChunkAt(t);
    if(idx!==cur){ cur=idx; onCurChange(t); }
    if(isBlind && autoPause && chunks[idx+1]){
      const rem=chunks[idx+1].t-t;
      if(rem<0.35&&rem>-0.5) player.pauseVideo();
    }
  },250);
}
function stopSync(){ clearInterval(syncTimer); }
function getChunkAt(t){
  let r=0;
  for(let i=0;i<chunks.length;i++){ if(t>=chunks[i].t) r=i; else break; }
  return r;
}
function onCurChange(){
  renderSubList();
  renderRightPanel();
  if(isBlind){
    document.getElementById('blind-cur').classList.add('show');
    document.getElementById('blind-cur-text').textContent=chunks[cur].text;
    document.getElementById('blind-cur-cn').textContent=chunks[cur].cn;
  }
  document.getElementById('prog').style.width=Math.round((cur+1)/chunks.length*100)+'%';
}

function seekTo(i,autoplay){
  cur=i;
  if(player){ player.seekTo(chunks[i].t,true); if(autoplay) player.playVideo(); }
  onCurChange();
}
function go(dir){
  const ni=cur+dir;
  if(ni>=0&&ni<chunks.length) seekTo(ni,true);
}
function togglePlay(){
  if(!player) return;
  playing?player.pauseVideo():player.playVideo();
}

// ── SUBTITLE LIST ──
function renderSubList(){
  if(isBlind) return;
  const area=document.getElementById('sub-area');
  area.innerHTML='';
  chunks.forEach((c,i)=>{
    const div=document.createElement('div');
    div.className='sub-chunk'+(i===cur?' active':'');
    div.innerHTML=`<div class="chunk-num">${String(i+1).padStart(2,'0')}</div>
      <div class="chunk-en">${c.text}</div>
      ${subLang==='bi'?`<div class="chunk-cn">${c.cn}</div>`:''}`;
    div.onclick=()=>seekTo(i,true);
    area.appendChild(div);
  });
  const el=area.children[cur];
  if(el) el.scrollIntoView({block:'nearest',behavior:'smooth'});
}

function setSubLang(l){
  subLang=l;
  document.getElementById('slb-en').classList.toggle('active',l==='en');
  document.getElementById('slb-bi').classList.toggle('active',l==='bi');
  const bar=document.getElementById('sub-lang-bar');
  bar.style.display=(l==='hide')?'none':'flex';
  renderSubList();
}
function toggleSubLang(){
  // cycle: en → bi → en
  setSubLang(subLang==='en'?'bi':'en');
  document.getElementById('btn-sub').classList.toggle('active',subLang==='bi');
}

// ── BLIND ──
function toggleBlind(){
  isBlind=!isBlind;
  document.getElementById('blind-overlay').classList.toggle('show',isBlind);
  document.getElementById('sub-area').style.display=isBlind?'none':'block';
  document.getElementById('sub-lang-bar').style.display=isBlind?'none':'flex';
  document.getElementById('btn-blind').classList.toggle('active',isBlind);
  if(!isBlind){
    renderSubList();
    document.getElementById('blind-cur').classList.remove('show');
  }
}
function blindRestart(){
  if(player){ player.seekTo(0,true); player.playVideo(); }
}

// ── MODE TABS ──
function setModeTab(t){
  modeTab=t;
  ['shadow','dictate','fill','note'].forEach(m=>{
    document.getElementById('tab-'+m).classList.toggle('active',m===t);
    document.getElementById('panel-'+m).classList.toggle('show',m===t);
  });
  renderRightPanel();
}

// ── SHADOW MODE ──
function setShadowMode(m){
  shadowMode=m;
  ['single','cont','timed'].forEach(s=>{
    document.getElementById('sm-'+s).classList.toggle('active',s===m);
  });
  renderShadow();
}

function renderShadow(){
  const c=document.getElementById('shadow-content');
  if(shadowMode==='single'){
    c.innerHTML=chunks.map((ch,i)=>`
      <div class="shadowing-card" id="sc-${i}" style="${i===cur?'border-color:var(--gold)':''}">
        <div class="sc-en">${ch.text}</div>
        <div class="sc-cn">${ch.cn}</div>
        <div class="sc-controls">
          <button class="sc-btn primary" onclick="seekTo(${i},true)">▶ 播放</button>
          <button class="sc-btn" id="rec-${i}" onclick="toggleRec(${i})">🎙 录音</button>
          <button class="sc-btn" onclick="seekTo(${i},true)">↺ 回放</button>
          <span class="rec-status" id="rs-${i}"></span>
        </div>
      </div>`).join('');
    // scroll to cur
    setTimeout(()=>{ const el=document.getElementById('sc-'+cur); if(el) el.scrollIntoView({block:'nearest',behavior:'smooth'}); },50);
  } else if(shadowMode==='cont'){
    const ch=chunks[cur];
    c.innerHTML=`
      <div class="continuous-card">
        <div class="sc-en" style="font-size:16px;line-height:1.8">${ch.text}</div>
        <div class="sc-cn" style="font-size:12px;color:var(--ink3);margin-top:4px">${cur+1} / ${chunks.length}</div>
        <div class="cc-nav">
          <button class="sc-btn" onclick="go(-1)">← 上一句</button>
          <button class="sc-btn primary" id="cont-play" onclick="contPlay()">▶ 继续</button>
          <button class="sc-btn" onclick="go(1)">下一句 →</button>
        </div>
      </div>`;
  } else {
    const ch=chunks[cur];
    c.innerHTML=`
      <div class="continuous-card">
        <div class="sc-en" style="font-size:16px;line-height:1.8">${ch.text}</div>
        <div class="sc-cn" style="font-size:12px;color:var(--ink3);margin-top:4px">${cur+1} / ${chunks.length}</div>
        <div class="countdown-bar show" id="cd-bar"><div class="countdown-fill" id="cd-fill" style="width:100%"></div></div>
        <div class="cc-nav">
          <button class="sc-btn" onclick="go(-1)">← 上一句</button>
          <button class="sc-btn primary" onclick="seekTo(cur,true)">▶ 播放</button>
          <button class="sc-btn" onclick="go(1)">下一句 →</button>
        </div>
      </div>`;
  }
}

function contPlay(){ seekTo(cur,true); }

let recStreams={};
function toggleRec(i){
  const btn=document.getElementById('rec-'+i);
  const rs=document.getElementById('rs-'+i);
  if(recState[i]==='recording'){
    recState[i]='idle';
    btn.textContent='🎙 录音';
    rs.textContent='录音已停止';
    if(recStreams[i]){ recStreams[i].getTracks().forEach(t=>t.stop()); delete recStreams[i]; }
  } else {
    recState[i]='recording';
    btn.textContent='⏹ 停止';
    rs.textContent='录音中...';
    navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{ recStreams[i]=s; }).catch(()=>{ rs.textContent='无麦克风权限'; recState[i]='idle'; btn.textContent='🎙 录音'; });
  }
}

// ── DICTATE MODE ──
function setDictateMode(m){
  dictateMode=m;
  document.getElementById('dm-cn').classList.toggle('active',m==='cn');
  document.getElementById('dm-none').classList.toggle('active',m==='none');
  renderDictate();
}
function renderDictate(){
  const c=document.getElementById('dictate-content');
  c.innerHTML=chunks.map((ch,i)=>`
    <div class="dictation-card">
      <div class="chunk-num">${String(i+1).padStart(2,'0')}</div>
      ${dictateMode==='cn'?`<div class="dc-prompt">${ch.cn}</div>`:'<div class="dc-prompt" style="color:var(--ink3);font-style:italic">（无提示，凭耳朵作答）</div>'}
      <button class="sc-btn primary" style="margin-bottom:8px;font-size:12px" onclick="seekTo(${i},true)">▶ 播放</button>
      <div class="dc-input-row">
        <input class="dc-input" id="di-${i}" placeholder="输入你听到的英文..." onkeydown="if(event.key==='Enter')checkDictate(${i})">
        <button class="sc-btn primary" onclick="checkDictate(${i})">检查</button>
      </div>
      <div class="dc-answer" id="da-${i}">${ch.text}</div>
    </div>`).join('');
}
function checkDictate(i){
  document.getElementById('da-'+i).classList.add('show');
}

// ── FILL MODE ──
function setFillMode(m){
  fillMode=m;
  document.getElementById('fm-cn').classList.toggle('active',m==='cn');
  document.getElementById('fm-none').classList.toggle('active',m==='none');
  renderFill();
}
function getFilledText(text){
  return text.split(' ').map(w=>{
    const clean=w.replace(/[^a-zA-Z']/g,'').toLowerCase();
    if(complexWords.includes(clean)){
      return `<span class="blank" id="bl-${w}-${Math.random().toString(36).slice(2,6)}" data-word="${w}">${'_'.repeat(w.length)}</span>`;
    }
    return w;
  }).join(' ');
}
function renderFill(){
  const c=document.getElementById('fill-content');
  c.innerHTML=chunks.map((ch,i)=>{
    const filled=getFilledText(ch.text);
    return `
    <div class="dictation-card">
      <div class="chunk-num">${String(i+1).padStart(2,'0')}</div>
      ${fillMode==='cn'?`<div class="dc-prompt">${ch.cn}</div>`:''}
      <div class="chunk-en" style="font-size:14px;line-height:1.9;margin-bottom:8px">${filled}</div>
      <button class="sc-btn primary" style="font-size:12px;margin-bottom:8px" onclick="seekTo(${i},true)">▶ 播放</button>
      <div class="dc-input-row">
        <input class="dc-input" id="fi-${i}" placeholder="输入缺失单词（逗号分隔）..." onkeydown="if(event.key==='Enter')checkFill(${i})">
        <button class="sc-btn primary" onclick="checkFill(${i})">检查</button>
      </div>
      <div class="dc-answer" id="fa-${i}">${ch.text}</div>
    </div>`;
  }).join('');
}
function checkFill(i){
  document.getElementById('fa-'+i).classList.add('show');
  document.querySelectorAll('.blank').forEach(b=>b.classList.add('revealed'));
}

// ── NOTE MODE ──
function renderNote(){
  const c=document.getElementById('note-content');
  c.innerHTML=chunks.map((ch,i)=>`
    <div class="note-card">
      <div class="chunk-num">${String(i+1).padStart(2,'0')}</div>
      <div class="note-en">${ch.text}</div>
      <div class="note-cn">${ch.cn}</div>
      <textarea class="note-input" id="ni-${i}" placeholder="写下你的笔记、生词、造句..."
        onblur="saveNote(${i})">${notes[i]||''}</textarea>
      <div class="note-saved" id="ns-${i}">已保存 ✓</div>
    </div>`).join('');
}
function saveNote(i){
  notes[i]=document.getElementById('ni-'+i).value;
  const s=document.getElementById('ns-'+i);
  s.style.display='block';
  setTimeout(()=>s.style.display='none',1500);
}

function renderRightPanel(){
  if(modeTab==='shadow') renderShadow();
  else if(modeTab==='dictate') renderDictate();
  else if(modeTab==='fill') renderFill();
  else renderNote();
}

// ── INIT ──
renderSubList();
renderRightPanel();

const tag=document.createElement('script');
tag.src='https://www.youtube.com/iframe_api';
document.head.appendChild(tag);
</script>
</body>
</html>
