/* Responsive video and synchronized transcript */
.player{aspect-ratio:16/9;width:100%;min-height:0}
.player video{position:absolute;inset:0}
.transcript{height:360px;overflow-y:auto;overscroll-behavior:contain;position:relative;padding:8px;scrollbar-width:thin;background:#f5f6fa}
.transcript-item{display:block;width:100%;text-align:left;border:1px solid #e1e5ed;border-radius:14px;background:#fff;padding:18px;margin-bottom:8px;color:var(--ink)}
.transcript-item.active{background:#edf0ff;border-color:#b7c3f2;box-shadow:inset 0 0 0 1px #d4dcf7}
.transcript-time{display:block;font-size:13px;color:#8793a6;font-variant-numeric:tabular-nums;margin-bottom:10px}
.transcript-item.active .transcript-time{color:#526bd6;font-weight:750}
.transcript-en{display:block;font-size:23px;font-weight:750;line-height:1.6}
.transcript-cn{display:block;font-size:17px;color:#8791a2;line-height:1.7;margin-top:8px}
.transcript .word.active{background:#dedaff;color:#5940bf}
.transcript[data-display="en"] .transcript-cn,.transcript[data-display="cn"] .transcript-en,.transcript[data-display="off"] .transcript-en,.transcript[data-display="off"] .transcript-cn{display:none}
body[data-activity="subtitle"] .shell{grid-template-columns:minmax(0,960px);justify-content:center}
body[data-activity="subtitle"] .right,body[data-activity="subtitle"] .mobile-list,body[data-activity="subtitle"] .practice>.meta,body[data-activity="subtitle"] #english,body[data-activity="subtitle"] #chinese,body[data-activity="subtitle"] #navRow,body[data-activity="subtitle"] #status{display:none!important}
body[data-activity="subtitle"] .practice{padding:0 0 16px}
body[data-activity="subtitle"] .subtitle-bar{margin:14px 16px 0}
@media(max-width:820px){
 .feature-tabs{margin-top:0;border-radius:0;position:static}
 body[data-activity="subtitle"] .practice{padding:0;border-radius:0}
 .transcript{height:calc(100dvh - 56px - 56.25vw - 58px - 88px - env(safe-area-inset-bottom));min-height:160px;padding:8px 10px 20px}
 .transcript-item{padding:15px;border-radius:12px}
 .transcript-en{font-size:21px}.transcript-cn{font-size:16px}
 body[data-activity="subtitle"] .subtitle-bar{margin:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const lessonVideo=$('#lessonVideo');
let state={index:0,activity:'subtitle',mode:'normal',subtitle:'bi',rate:1,repeat:1,extra:5,subtitleDisplay:'bi',subtitleRate:1,favorites:new Set()};
let mediaRecorder=null,recorded=[],recordingUrl='',sessionUrls=[],timerRAF=0,runToken=0,isRecording=false;
function fmt(v){const n=Math.max(0,Math.floor(v));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function cloneControls(target){target.append($('#controlsTemplate').content.cloneNode(true))}
cloneControls($('#desktopControls'));cloneControls($('#mobileControls'));cloneControls($('#inlineShadowControls'));
function syncControls(){
  $$('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===state.mode));
  $$('[data-setting]').forEach(el=>el.value=String(state[el.dataset.setting]));
}
function wordHtml(c){return c.words.map((w,i)=>`<span class="word" data-word-index="${i}" data-start="${w.start}" data-end="${w.end}">${w.word}</span>`).join(' ')}
function render(){const c=chunks[state.index];const words=wordHtml(c);$('#english').innerHTML=words;$('#chinese').textContent=c.cn;$('#videoEnglish').innerHTML=words;$('#videoChinese').textContent=c.cn;$('#counter').textContent=`第 ${state.index+1} / ${chunks.length} 句`;$('#timecode').textContent=`${fmt(c.t)}–${fmt(c.end)}`;$('#english').hidden=!['bi','en'].includes(state.subtitle);$('#chinese').hidden=!['bi','cn'].includes(state.subtitle);$('#prevBtn').disabled=state.index===0;$('#nextBtn').disabled=state.index===chunks.length-1;$('#favBtn').textContent=state.favorites.has(state.index)?'★ 已收藏':'☆ 收藏表达';renderLists();syncControls();renderActivity();updateWordHighlight(lessonVideo.currentTime)}
function renderTranscript(){
 const box=$('#transcript');
 if(!box.children.length)box.innerHTML=chunks.map((c,i)=>`<button class="transcript-item" data-index="${i}" aria-label="播放第 ${i+1} 句"><span class="transcript-time">${fmt(c.t)}</span><span class="transcript-en">${wordHtml(c)}</span><span class="transcript-cn">${c.cn}</span></button>`).join('');
 box.dataset.display=state.subtitleDisplay;
 [...box.children].forEach((el,i)=>{el.classList.toggle('active',i===state.index);if(i===state.index)el.setAttribute('aria-current','true');else el.removeAttribute('aria-current')});
}
function renderLists(){renderTranscript();const html=chunks.map((c,i)=>`<button class="sentence-item ${i===state.index?'active':''}" data-index="${i}"><span class="num">${String(i+1).padStart(2,'0')}</span><span><strong>${c.text}</strong><small>${c.cn}</small></span><span class="duration">${c.dur.toFixed(1)}s</span></button>`).join('');$('#desktopSentenceList').innerHTML=html;$('#mobileSentenceList').innerHTML=html}
function status(s){$('#status').textContent=s}
function stopAll(){runToken++;speechSynthesis.cancel();lessonVideo.pause();cancelAnimationFrame(timerRAF);$('#timerWrap').classList.remove('show')}
function beep(){return new Promise(resolve=>{try{const ac=new (window.AudioContext||window.webkitAudioContext)(),o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.18);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.18);setTimeout(()=>{ac.close();resolve()},240)}catch(e){resolve()}})}
function playVideoSegment(index,rate,token){return new Promise(resolve=>{const c=chunks[index];let raf=0,finished=false;const finish=()=>{if(finished)return;finished=true;cancelAnimationFrame(raf);lessonVideo.removeEventListener('ended',finish);if(lessonVideo.currentTime>=c.end-.04)lessonVideo.pause();resolve()};const tick=()=>{if(token!==runToken||lessonVideo.currentTime>=c.end-.035)return finish();raf=requestAnimationFrame(tick)};lessonVideo.pause();lessonVideo.playbackRate=rate;lessonVideo.currentTime=c.t+.01;lessonVideo.addEventListener('ended',finish,{once:true});lessonVideo.play().then(()=>{raf=requestAnimationFrame(tick)}).catch(finish)})}
function speakOnce(index,token){if(token!==runToken)return Promise.resolve();return playVideoSegment(index,state.rate,token)}
async function playSubtitleOnce(index=state.index){const token=++runToken;status(`字幕播放 · ${state.subtitleRate.toFixed(1)}×`);await playVideoSegment(index,state.subtitleRate,token);if(token===runToken)status('播放完成')}
async function playExerciseOnce(index=state.index){const token=++runToken;status('正在播放当前句');await playVideoSegment(index,1,token);if(token===runToken)status('播放完成，请填写答案')}
async function playSentence(index=state.index,forTimed=false){const token=++runToken;speechSynthesis.cancel();let n=0,max=state.repeat===0?999:state.repeat;status(`正在播放 · ${state.rate}×`);while(token===runToken&&n<max){await speakOnce(index,token);n++;if(token!==runToken)break;if(n<max)await new Promise(r=>setTimeout(r,450));}if(token!==runToken)return;if(forTimed||state.mode!=='normal')await timedRecord(index,token);else status('播放完成，可以开始录音')}
async function setupRecorder(){if(mediaRecorder)return true;if(!navigator.mediaDevices?.getUserMedia){status('当前浏览器不支持录音');return false}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});mediaRecorder=new MediaRecorder(stream);mediaRecorder.ondataavailable=e=>{if(e.data.size)recorded.push(e.data)};mediaRecorder.onstop=()=>{const blob=new Blob(recorded,{type:mediaRecorder.mimeType||'audio/webm'});recorded=[];if(recordingUrl)URL.revokeObjectURL(recordingUrl);recordingUrl=URL.createObjectURL(blob);$('#replayBtn').disabled=false;if(state.mode==='continuous'){sessionUrls.push(recordingUrl);syncControls()}status('录音已完成，可以回放')};return true}catch(e){status('需要允许麦克风权限才能录音');return false}}
async function startRecording(auto=false){if(isRecording)return;const ok=await setupRecorder();if(!ok)return;recorded=[];mediaRecorder.start();isRecording=true;$('#recordBtn').textContent='■ 停止';status(auto?'限时录音中…':'正在录音…')}
function stopRecording(){if(mediaRecorder&&mediaRecorder.state==='recording')mediaRecorder.stop();isRecording=false;$('#recordBtn').textContent='● 录音'}
async function timedRecord(index,token){await beep();if(token!==runToken)return;const total=chunks[index].dur+Number(state.extra);const ok=await setupRecorder();if(!ok)return;await startRecording(true);$('#timerWrap').classList.add('show');const start=performance.now();return new Promise(resolve=>{function frame(now){if(token!==runToken){stopRecording();return resolve()}const left=Math.max(0,total-(now-start)/1000);$('#timerValue').textContent=left.toFixed(1)+'s';$('#timerLabel').textContent='请跟读';$('#timerBar').style.transform=`scaleX(${left/total})`;if(left<=0){stopRecording();$('#timerWrap').classList.remove('show');return resolve()}timerRAF=requestAnimationFrame(frame)}timerRAF=requestAnimationFrame(frame)})}
async function startContinuous(){stopAll();sessionUrls=[];recordingUrl='';$('#replayBtn').disabled=true;syncControls();const token=runToken;status('连续练习开始');for(let i=state.index;i<chunks.length&&token===runToken;i++){state.index=i;render();await speakOnce(i,token);if(token!==runToken)break;await timedRecord(i,token);await new Promise(r=>setTimeout(r,500))}if(token===runToken)status(`本轮完成，共练习 ${sessionUrls.length} 句`)}
async function replaySession(){for(const url of sessionUrls){await new Promise(resolve=>{const a=new Audio(url);a.onended=resolve;a.onerror=resolve;a.play()})}}

const clozeWords=['muscle','plinky','eyes','happy','wine','right','Richard','glass','Sorry','fine','Use','anything','try','meadow','stars','mistake','questions','moonlight','totally','fine','wagering','working','awake'];
function updateOverlayVisibility(){const a=state.activity;if(a==='subtitle'||a==='cloze'||a==='dictation'){$('#videoSubtitles').hidden=true;return}$('#videoSubtitles').hidden=false;const display=a==='subtitle'?state.subtitleDisplay:state.subtitle;$('#videoEnglish').hidden=!['bi','en'].includes(display);$('#videoChinese').hidden=!['bi','cn'].includes(display)}
function updateWordHighlight(time){$$('#english .word,#videoEnglish .word,#transcript .active .word').forEach(el=>{const on=time>=Number(el.dataset.start)&&time<Number(el.dataset.end);el.classList.toggle('active',on)})}
function activeIndexAt(time){let found=0;for(let i=0;i<chunks.length;i++){if(time>=chunks[i].t)found=i;else break}return found}
function scrollActiveSentence(){
 const boxes=state.activity==='subtitle'?[$('#transcript')]:[$('#desktopSentenceList'),$('#mobileSentenceList')];
 for(const box of boxes){const el=box?.querySelector('.active');if(el&&box.clientHeight){box.scrollTo({top:box.scrollTop+el.getBoundingClientRect().top-box.getBoundingClientRect().top-8,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'})}}
}
function syncToVideo(){const time=lessonVideo.currentTime,idx=activeIndexAt(time);if(idx!==state.index){state.index=idx;render();scrollActiveSentence()}updateWordHighlight(time)}
lessonVideo.addEventListener('timeupdate',syncToVideo);lessonVideo.addEventListener('seeked',syncToVideo);lessonVideo.addEventListener('play',()=>status('视频播放中，字幕将自动同步'));
function renderActivity(){
  const a=state.activity,c=chunks[state.index];
  document.body.dataset.activity=a;$('#transcript').hidden=a!=='subtitle';
  $$('.feature-tab').forEach(b=>b.classList.toggle('active',b.dataset.activity===a));
  $('#clozePanel').hidden=a!=='cloze';$('#dictationPanel').hidden=a!=='dictation';
  $('#subtitleBar').hidden=a!=='subtitle';$('#shadowBar').hidden=a!=='shadow';$('#inlineShadowControls').hidden=a!=='shadow';
  $('#navRow').style.display='';
  $('#english').hidden=a==='cloze'||a==='dictation'||(a==='subtitle'&&!['bi','en'].includes(state.subtitleDisplay))||(a==='shadow'&&!['bi','en'].includes(state.subtitle));
  $('#chinese').hidden=a==='cloze'||a==='dictation'||(a==='subtitle'?!['bi','cn'].includes(state.subtitleDisplay):!['bi','cn'].includes(state.subtitle));
  $('#speedMenu').textContent=state.subtitleRate.toFixed(1)+'×';
  $('#subtitleMenu').textContent=({bi:'双语',en:'英文',cn:'中文',off:'无字幕'})[state.subtitleDisplay];
  if(a==='cloze')renderCloze();
  if(a==='dictation'){$('#chinese').hidden=true;$('#english').hidden=true;$('#dictationHint').textContent=$('#dictationChinese').checked?c.cn:'';}

function renderCloze(){
  const c=chunks[state.index],word=clozeWords[state.index];
  const re=new RegExp(word,'i');
  $('#clozeSentence').innerHTML=c.text.replace(re,'<span class="blank-word">'+word+'</span>');
  $('#clozeInput').placeholder='输入被挖掉的原词';
  $('#clozeFeedback').textContent='';
  $('#clozeChinese').closest('.exercise-box').querySelector('.translation-hint')?.remove();
  if($('#clozeChinese').checked){const p=document.createElement('p');p.className='translation-hint chinese';p.textContent=c.cn;$('#clozeSentence').after(p)}
}
function norm(s){return s.toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]/g,'').replace(/\s+/g,' ').trim()}
function chooseActivity(a){stopAll();state.activity=a;$('#clozeInput').value='';$('#dictationInput').value='';$('#clozeFeedback').textContent='';$('#dictationFeedback').textContent='';status(({subtitle:'字幕模式：可调整倍速和字幕显示',shadow:'跟读模式：选择普通、限时单句或限时连续',cloze:'挖空模式：播放当前句后填写缺少的原词',dictation:'听写模式：播放后写出完整句子'})[a]);render()}

$$('[data-mode]').forEach(b=>b.onclick=()=>{stopAll();state.mode=b.dataset.mode;const msg=state.mode==='normal'?'普通跟读：播放和录音由你手动控制':state.mode==='timed'?'限时单句：播放结束后自动提示并开始限时录音':'限时连读：从当前句开始，自动完成播放、录音并进入下一句';status(msg);$$('[data-mode-hint]').forEach(x=>x.textContent=msg);syncControls()});
$$('[data-setting]').forEach(el=>el.onchange=()=>{state[el.dataset.setting]=el.dataset.setting==='subtitle'?el.value:Number(el.value);render()});
document.addEventListener('click',e=>{const item=e.target.closest('[data-index]');if(item){stopAll();state.index=Number(item.dataset.index);lessonVideo.currentTime=chunks[state.index].t;render();scrollActiveSentence();if(state.activity==='subtitle')playTranscript()}});
$('#playBtn').onclick=()=>state.mode==='continuous'?startContinuous():playSentence(state.index,state.mode==='timed');$('#recordBtn').onclick=()=>isRecording?stopRecording():startRecording();$('#replayBtn').onclick=()=>recordingUrl&&new Audio(recordingUrl).play();$('#prevBtn').onclick=()=>{if(state.index){stopAll();state.index--;lessonVideo.currentTime=chunks[state.index].t;render()}};$('#nextBtn').onclick=()=>{if(state.index<chunks.length-1){stopAll();state.index++;lessonVideo.currentTime=chunks[state.index].t;render()}};$('#favBtn').onclick=()=>{state.favorites.has(state.index)?state.favorites.delete(state.index):state.favorites.add(state.index);render();const t=$('#toast');t.textContent=state.favorites.has(state.index)?'已收藏表达':'已取消收藏';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1200)};
$('#closeSettings').onclick=()=>$('#drawerMask').classList.remove('show');$('#drawerMask').onclick=e=>{if(e.target===$('#drawerMask'))$('#drawerMask').classList.remove('show')};

$$('[data-activity]').forEach(b=>b.onclick=()=>chooseActivity(b.dataset.activity));
$('#clozeChinese').onchange=renderCloze;
$('#dictationChinese').onchange=()=>{$('#dictationHint').textContent=$('#dictationChinese').checked?chunks[state.index].cn:''};
$('#checkCloze').onclick=()=>{const expected=clozeWords[state.index],got=norm($('#clozeInput').value);$('#clozeFeedback').textContent=got&&got===norm(expected)?'✓ 正确':'再听一次并尝试填写';};
$('#showCloze').onclick=()=>{$('#clozeFeedback').textContent='原词：'+clozeWords[state.index]};
$('#checkDictation').onclick=()=>{const got=norm($('#dictationInput').value),ans=norm(chunks[state.index].text);const aw=new Set(ans.split(' ')),gw=new Set(got.split(' '));const hit=[...aw].filter(w=>gw.has(w)).length,pct=Math.round(hit/aw.size*100);$('#dictationFeedback').textContent=got?(pct>=90?'✓ 很准确，词汇覆盖 '+pct+'%':'词汇覆盖 '+pct+'%，再检查遗漏和拼写'):'请先输入听到的句子'};
$('#showDictation').onclick=()=>{$('#dictationFeedback').textContent='原文：'+chunks[state.index].text};
$('#clozePlay').onclick=()=>playExerciseOnce(state.index);$('#dictationPlay').onclick=()=>playExerciseOnce(state.index);
function playTranscript(){lessonVideo.playbackRate=state.subtitleRate;lessonVideo.play().catch(()=>status('无法播放，请检查视频文件是否可用'))}
function updatePlayButton(){const playing=!lessonVideo.paused&&!lessonVideo.ended;$('#subtitlePlay').textContent=playing?'❚❚':'▶';$('#subtitlePlay').setAttribute('aria-label',playing?'暂停':'播放')}
lessonVideo.addEventListener('play',updatePlayButton);lessonVideo.addEventListener('pause',updatePlayButton);lessonVideo.addEventListener('ended',updatePlayButton);
$('#subtitlePlay').onclick=()=>{if(lessonVideo.paused){if(lessonVideo.ended)lessonVideo.currentTime=0;playTranscript()}else lessonVideo.pause()};function stepSubtitle(delta){const playing=!lessonVideo.paused;stopAll();state.index=Math.max(0,Math.min(chunks.length-1,state.index+delta));lessonVideo.currentTime=chunks[state.index].t;render();scrollActiveSentence();if(playing)playTranscript()}$('#subtitlePrev').onclick=()=>stepSubtitle(-1);$('#subtitleNext').onclick=()=>stepSubtitle(1);
$('#speedMenu').onclick=()=>$('#speedPop').classList.toggle('show');$('#subtitleMenu').onclick=()=>$('#subtitlePop').classList.toggle('show');
$$('[data-quick-rate]').forEach(b=>b.onclick=()=>{state.subtitleRate=Number(b.dataset.quickRate);lessonVideo.playbackRate=state.subtitleRate;$('#speedPop').classList.remove('show');render()});
$$('[data-quick-sub]').forEach(b=>b.onclick=()=>{state.subtitleDisplay=b.dataset.quickSub;$('#subtitlePop').classList.remove('show');render()});

render();
</script>
</body>
</html>
